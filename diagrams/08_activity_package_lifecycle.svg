<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
    .card-header { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .header-text { font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .line { stroke: #334155; stroke-width: 2; fill: none; }
    .line-blue { stroke: #2563eb; stroke-width: 2; fill: none; }
    .line-green { stroke: #16a34a; stroke-width: 2; fill: none; }
    .line-red { stroke: #dc2626; stroke-width: 2; fill: none; }
    .line-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .badge { rx: 12; stroke-width: 1.2; }
    .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; }
</style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>

  </defs>
  <!-- Pure White Background -->
  <rect width="1200" height="780" fill="#ffffff" />
  
  <!-- Header Title -->
  <text x="50" y="45" class="title">08. Activity Diagram - Complete Package Lifecycle</text>
  <text x="50" y="70" class="subtitle">Step-by-step workflow from arrival at Gate No. 2 to verified handover and terminal states</text>
  
  <!-- Diagram Content -->
  
  <!-- Start Node -->
  <circle cx="600" cy="90" r="14" fill="#0f172a" />
  <line x1="600" y1="104" x2="600" y2="135" class="line" marker-end="url(#arrow)" />

  <!-- Step 1: Physical Arrival -->
  <rect x="480" y="135" width="240" height="42" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
  <text x="600" y="161" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">1. Package Arrives at Gate No. 2</text>
  <line x1="600" y1="177" x2="600" y2="205" class="line" marker-end="url(#arrow)" />

  <!-- Step 2: Barcode Scan &amp; Intake -->
  <rect x="450" y="205" width="300" height="42" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.8" />
  <text x="600" y="231" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">2. Scan Tracking, Recipient &amp; Manual Rack</text>
  <line x1="600" y1="247" x2="600" y2="275" class="line" marker-end="url(#arrow)" />

  <!-- Decision: Recipient Matched? -->
  <polygon points="600,275 690,310 600,345 510,310" fill="#ffffff" stroke="#eab308" stroke-width="2" />
  <text x="600" y="314" font-size="11" font-weight="700" fill="#854d0e" text-anchor="middle">Matched?</text>

  <!-- Branch No -> Unidentified -->
  <line x1="690" y1="310" x2="880" y2="310" class="line-red" marker-end="url(#arrow-red)" />
  <rect x="710" y="295" width="30" height="16" fill="#ffffff" /><text x="725" y="307" font-size="11" font-weight="700" fill="#dc2626">No</text>
  <rect x="880" y="290" width="220" height="40" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
  <text x="990" y="315" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">Status: UNIDENTIFIED / INCIDENT</text>

  <!-- Branch Yes -> Assign Storage -->
  <line x1="600" y1="345" x2="600" y2="385" class="line-green" marker-end="url(#arrow-green)" />
  <rect x="605" y="352" width="35" height="16" fill="#ffffff" /><text x="622" y="364" font-size="11" font-weight="700" fill="#16a34a">Yes</text>

  <rect x="460" y="385" width="280" height="42" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.8" />
  <text x="600" y="411" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">Status: VERIFIED &amp; Rack Assigned</text>
  <line x1="600" y1="427" x2="600" y2="455" class="line" marker-end="url(#arrow)" />

  <!-- Shelf Reservation -> Ready for Pickup -->
  <rect x="460" y="455" width="280" height="42" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8" />
  <text x="600" y="481" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">Status: READY_FOR_PICKUP (Rack No)</text>
  <line x1="600" y1="497" x2="600" y2="525" class="line" marker-end="url(#arrow)" />

  <!-- Return Flow Branch (Left Side) -->
  <line x1="460" y1="475" x2="310" y2="475" class="line-red" marker-end="url(#arrow-red)" />
  <rect x="330" y="462" width="110" height="16" fill="#ffffff" /><text x="385" y="474" font-size="10.5" font-weight="600" fill="#dc2626" text-anchor="middle">Return Request</text>

  <rect x="110" y="455" width="200" height="42" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" />
  <text x="210" y="481" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Status: RETURN_REQUESTED</text>
  <line x1="210" y1="497" x2="210" y2="595" class="line-red" marker-end="url(#arrow-red)" />

  <rect x="110" y="595" width="200" height="42" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" />
  <text x="210" y="621" font-size="11" font-weight="600" fill="#991b1b" text-anchor="middle">Handed Back to Courier</text>
  <line x1="210" y1="637" x2="210" y2="665" class="line-red" marker-end="url(#arrow-red)" />

  <rect x="110" y="665" width="200" height="45" rx="8" fill="#dc2626" stroke="#b91c1c" stroke-width="2" />
  <text x="210" y="693" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">RETURNED (Terminal)</text>
  <circle cx="210" cy="740" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
  <circle cx="210" cy="740" r="8" fill="#0f172a" />
  <line x1="210" y1="710" x2="210" y2="726" class="line" marker-end="url(#arrow)" />

  <!-- Learner Pickup Request (Normal Path) -->
  <rect x="470" y="525" width="260" height="42" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
  <text x="600" y="551" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Learner Requests 6-Digit Pickup Token</text>
  <line x1="600" y1="567" x2="600" y2="595" class="line" marker-end="url(#arrow)" />

  <!-- Verification &amp; Handover -->
  <rect x="470" y="595" width="260" height="42" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.8" />
  <text x="600" y="621" font-size="12" font-weight="600" fill="#0f172a" text-anchor="middle">Security Verifies Code at Gate</text>
  <line x1="600" y1="637" x2="600" y2="665" class="line" marker-end="url(#arrow)" />

  <!-- Terminal State: COLLECTED -->
  <rect x="480" y="665" width="240" height="45" rx="8" fill="#16a34a" stroke="#15803d" stroke-width="2" />
  <text x="600" y="693" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">COLLECTED (Handover Complete)</text>

  <!-- End Node -->
  <circle cx="600" cy="740" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
  <circle cx="600" cy="740" r="8" fill="#0f172a" />
  <line x1="600" y1="710" x2="600" y2="726" class="line" marker-end="url(#arrow)" />

</svg>