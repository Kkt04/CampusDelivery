<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="100%" height="100%">
  <defs>
    <style>
    .bg { fill: #f8fafc; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #0f172a; font-size: 20px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; fill: #475569; font-size: 13px; }
    .c-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; text-anchor: middle; }
    .c-stereo { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; text-anchor: middle; font-style: italic; }
    .attr { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11px; fill: #1e293b; }
    .method { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11px; fill: #0369a1; font-weight: 500; }
    .sep { stroke: #e2e8f0; stroke-width: 1; }
    .actor-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 4; }
    .part-box { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; rx: 4; }
    .life-line { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; }
    .msg-line { stroke: #0f172a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .ret-line { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-gray); }
    .msg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #0f172a; font-weight: 500; }
    .ret-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; font-style: italic; }
    .note-box { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1; rx: 4; }
    .note-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #92400e; font-weight: 500; }
    .step-badge { fill: #2563eb; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
</style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0f172a" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>

  </defs>
  <rect width="1200" height="950" class="bg" />

  <text x="40" y="35" class="title">08. Activity Diagram - Complete End-to-End Package Lifecycle</text>
  <text x="40" y="55" class="subtitle">Swimlanes: Gate Intake, Triage &amp; Storage, Learner Action, Handover Verification, and Exceptions/Terminus</text>

  <!-- Start Node -->
  <circle cx="150" cy="110" r="14" fill="#0f172a" />
  <text x="150" y="140" class="c-name" font-size="11">Courier Arrives at Gate 2</text>

  <!-- Action: Intake Details -->
  <rect x="70" y="160" width="160" height="50" class="box" stroke="#2563eb" />
  <text x="150" y="185" class="c-name" font-size="11">Staff Inspects Parcel &amp;</text>
  <text x="150" y="200" class="c-name" font-size="11">Enters Intake Data</text>

  <!-- Decision: Duplicate? -->
  <polygon points="150,240 210,270 150,300 90,270" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="150" y="274" class="msg-text" text-anchor="middle" font-size="10">Duplicate?</text>

  <!-- Rejection branch -->
  <line x1="210" y1="270" x2="330" y2="270" class="msg-line" stroke="#dc2626" />
  <text x="250" y="262" class="ret-text" fill="#dc2626">Yes</text>
  <rect x="330" y="250" width="140" height="40" class="box" fill="#fff1f2" stroke="#dc2626" />
  <text x="400" y="274" class="c-name" font-size="10.5" fill="#dc2626">Reject &amp; Log Audit</text>
  <circle cx="510" cy="270" r="12" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
  <circle cx="510" cy="270" r="7" fill="#dc2626" />

  <!-- Unique branch -->
  <line x1="150" y1="300" x2="150" y2="340" class="msg-line" />
  <text x="165" y="325" class="ret-text">No</text>

  <!-- Decision: Condition -->
  <polygon points="150,340 210,370 150,400 90,370" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="150" y="374" class="msg-text" text-anchor="middle" font-size="10">Condition?</text>

  <!-- Damaged hold branch -->
  <line x1="210" y1="370" x2="330" y2="370" class="msg-line" stroke="#d97706" />
  <text x="250" y="362" class="ret-text" fill="#d97706">Damaged</text>
  <rect x="330" y="350" width="140" height="40" class="box" fill="#fef3c7" stroke="#d97706" />
  <text x="400" y="374" class="c-name" font-size="10.5" fill="#b45309">Status = DAMAGED</text>

  <!-- Good branch -->
  <line x1="150" y1="400" x2="150" y2="440" class="msg-line" />
  <text x="165" y="425" class="ret-text">Good</text>

  <!-- Decision: Learner Match? -->
  <polygon points="150,440 210,470 150,500 90,470" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="150" y="474" class="msg-text" text-anchor="middle" font-size="10">Recipient?</text>

  <!-- Unidentified hold -->
  <line x1="210" y1="470" x2="330" y2="470" class="msg-line" stroke="#d97706" />
  <text x="250" y="462" class="ret-text" fill="#d97706">Unknown</text>
  <rect x="330" y="450" width="140" height="40" class="box" fill="#fef3c7" stroke="#d97706" />
  <text x="400" y="474" class="c-name" font-size="10.5" fill="#b45309">UNIDENTIFIED</text>

  <!-- Verified state -->
  <line x1="150" y1="500" x2="150" y2="540" class="msg-line" />
  <text x="165" y="525" class="ret-text">Matched</text>
  <rect x="70" y="540" width="160" height="45" class="box" fill="#eff6ff" stroke="#2563eb" />
  <text x="150" y="565" class="c-name" font-size="11" fill="#1e40af">Status = VERIFIED</text>

  <!-- Triage resolutions connect back -->
  <path d="M 470,370 L 520,370 L 520,560 L 230,560" class="ret-line" stroke="#047857" />
  <text x="525" y="460" class="subtitle" font-size="10" fill="#047857">Staff Identifies Recipient or Releases Hold</text>

  <!-- Shelf Allocation -->
  <line x1="150" y1="585" x2="150" y2="625" class="msg-line" />
  <rect x="60" y="625" width="180" height="50" class="box" stroke="#059669" />
  <text x="150" y="648" class="c-name" font-size="11" fill="#047857">Strategy Ranks Shelves &amp;</text>
  <text x="150" y="663" class="c-name" font-size="11" fill="#047857">Reserves Slot Atomically</text>

  <!-- Status = READY_FOR_PICKUP -->
  <line x1="150" y1="675" x2="150" y2="715" class="msg-line" />
  <rect x="60" y="715" width="180" height="45" class="box" fill="#ecfdf5" stroke="#10b981" />
  <text x="150" y="740" class="c-name" font-size="11" fill="#047857">Status = READY_FOR_PICKUP</text>

  <!-- Learner requests code -->
  <line x1="240" y1="737" x2="420" y2="737" class="msg-line" stroke="#7c3aed" />
  <rect x="420" y="715" width="180" height="45" class="box" fill="#f5f3ff" stroke="#7c3aed" />
  <text x="510" y="735" class="c-name" font-size="11" fill="#6d28d9">Learner Requests Code</text>
  <text x="510" y="750" class="c-name" font-size="10" fill="#6d28d9">(HMAC 6-Digit Token)</text>

  <!-- Gate Verification & Handover -->
  <line x1="600" y1="737" x2="720" y2="737" class="msg-line" />
  <rect x="720" y="715" width="180" height="50" class="box" stroke="#2563eb" />
  <text x="810" y="738" class="c-name" font-size="11">Security Verifies Code &amp;</text>
  <text x="810" y="753" class="c-name" font-size="11">Institutional ID Card</text>

  <!-- Terminal Success Node -->
  <line x1="900" y1="737" x2="1020" y2="737" class="msg-line" stroke="#16a34a" stroke-width="2" />
  <rect x="1020" y="715" width="140" height="45" class="box" fill="#dcfce7" stroke="#16a34a" />
  <text x="1090" y="735" class="c-name" font-size="11" fill="#15803d">Status = COLLECTED</text>
  <text x="1090" y="750" class="subtitle" font-size="9.5" fill="#15803d">Slot Released (-1)</text>

  <circle cx="1110" cy="800" r="14" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
  <circle cx="1110" cy="800" r="8" fill="#16a34a" />
  <line x1="1090" y1="760" x2="1110" y2="786" class="msg-line" stroke="#16a34a" />
  <text x="1110" y="830" class="c-name" font-size="10.5" fill="#15803d">Terminal</text>

  <!-- Exception Streams: Overdue & Investigation -->
  <path d="M 150,760 L 150,860 L 720,860" class="ret-line" stroke="#d97706" />
  <text x="350" y="852" class="ret-text" fill="#d97706">Overdue &gt; 5 days or escalated dispute</text>
  <rect x="720" y="835" width="180" height="50" class="box" fill="#fffbeb" stroke="#d97706" />
  <text x="810" y="858" class="c-name" font-size="10.5" fill="#b45309">Admin Reviews</text>
  <text x="810" y="873" class="subtitle" font-size="10" fill="#b45309">RETURN_REQUESTED / LOST</text>

  <line x1="900" y1="860" x2="980" y2="860" class="msg-line" stroke="#d97706" />
  <circle cx="1000" cy="860" r="12" fill="#ffffff" stroke="#d97706" stroke-width="2" />
  <circle cx="1000" cy="860" r="7" fill="#d97706" />
  <text x="1000" y="888" class="c-name" font-size="10" fill="#b45309">Terminal: Returned/Lost</text>

</svg>
