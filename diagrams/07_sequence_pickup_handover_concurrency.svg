<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
    .card-header { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .header-text { font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .line { stroke: #334155; stroke-width: 2; fill: none; }
    .line-blue { stroke: #2563eb; stroke-width: 2; fill: none; }
    .line-green { stroke: #16a34a; stroke-width: 2; fill: none; }
    .line-red { stroke: #dc2626; stroke-width: 2; fill: none; }
    .line-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .badge { rx: 12; stroke-width: 1.2; }
    .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; }
</style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>

  </defs>
  <!-- Pure White Background -->
  <rect width="1200" height="650" fill="#ffffff" />
  
  <!-- Header Title -->
  <text x="50" y="45" class="title">07. Sequence Diagram - Handover Race Condition &amp; Concurrency Guard</text>
  <text x="50" y="70" class="subtitle">Atomic Compare-And-Swap (CAS) token redemption preventing double-delivery across concurrent staff</text>
  
  <!-- Diagram Content -->
  
  <!-- Lifelines -->
  <!-- 1. Guard A -->
  <g transform="translate(100, 110)">
    <rect width="130" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
    <text x="65" y="22" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Security Guard A</text>
    <line x1="65" y1="36" x2="65" y2="580" class="line-dash" />
  </g>
  <!-- 2. Guard B (Racer) -->
  <g transform="translate(360, 110)">
    <rect width="130" height="36" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" />
    <text x="65" y="22" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">Security Guard B</text>
    <line x1="65" y1="36" x2="65" y2="580" class="line-dash" />
  </g>
  <!-- 3. PickupService -->
  <g transform="translate(640, 110)">
    <rect width="140" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
    <text x="70" y="22" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">PickupService</text>
    <line x1="70" y1="36" x2="70" y2="580" class="line-dash" />
  </g>
  <!-- 4. MongoDB -->
  <g transform="translate(940, 110)">
    <rect width="160" height="36" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />
    <text x="80" y="22" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">MongoDB (Atomic Engine)</text>
    <line x1="80" y1="36" x2="80" y2="580" class="line-dash" />
  </g>

  <!-- Concurrent Calls Marker -->
  <rect x="80" y="165" width="460" height="24" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="3,3" />
  <text x="310" y="181" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">CONCURRENT HANDOVER ATTEMPTS WITH SAME PICKUP CODE</text>

  <!-- Step 1: Guard A submits code -->
  <line x1="165" y1="210" x2="710" y2="210" class="line-blue" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="230" y="195" width="220" height="16" fill="#ffffff" />
  <text x="340" y="207" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">1a. verify_and_handover(code="849201")</text>

  <!-- Step 1b: Guard B submits code almost simultaneously -->
  <line x1="425" y1="235" x2="710" y2="235" class="line-red" stroke-width="2" marker-end="url(#arrow-red)" />
  <rect x="450" y="220" width="220" height="16" fill="#ffffff" />
  <text x="560" y="232" font-size="11" font-weight="600" fill="#dc2626" text-anchor="middle">1b. verify_and_handover(code="849201")</text>

  <!-- Step 2: Guard A atomic CAS token update -->
  <line x1="710" y1="275" x2="1020" y2="275" class="line-blue" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="730" y="258" width="270" height="18" fill="#ffffff" />
  <text x="865" y="271" font-size="10.5" font-weight="600" fill="#2563eb">2. find_one_and_update(used_at=null, $set: used_at=now)</text>

  <!-- Step 3: Guard A WINS race -->
  <line x1="1020" y1="310" x2="710" y2="310" class="line-dash" marker-end="url(#arrow-gray)" />
  <rect x="760" y="295" width="210" height="16" fill="#ffffff" />
  <text x="865" y="307" font-size="10.5" fill="#16a34a" text-anchor="middle">3. Token row matched! Return doc</text>

  <!-- Step 4: Guard B atomic CAS executes immediately after -->
  <line x1="710" y1="350" x2="1020" y2="350" class="line-red" stroke-width="2" marker-end="url(#arrow-red)" />
  <rect x="730" y="333" width="270" height="18" fill="#ffffff" />
  <text x="865" y="346" font-size="10.5" font-weight="600" fill="#dc2626">4. find_one_and_update(used_at=null, $set: used_at=now)</text>

  <!-- Step 5: Guard B FAILS race -->
  <line x1="1020" y1="385" x2="710" y2="385" class="line-dash" marker-end="url(#arrow-red)" />
  <rect x="780" y="370" width="180" height="16" fill="#ffffff" />
  <text x="870" y="382" font-size="10.5" font-weight="600" fill="#dc2626" text-anchor="middle">5. null returned (used_at is not null)</text>

  <!-- Step 6: Guard A completes package handover -->
  <line x1="710" y1="420" x2="1020" y2="420" class="line" marker-end="url(#arrow)" />
  <rect x="740" y="405" width="250" height="16" fill="#ffffff" />
  <text x="865" y="417" font-size="10.5" fill="#0f172a">6. insert(pickup_record), status=COLLECTED</text>

  <!-- Guard A Success Result -->
  <line x1="710" y1="465" x2="165" y2="465" class="line-green" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <rect x="220" y="450" width="240" height="20" fill="#ffffff" />
  <text x="340" y="464" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">7a. 200 OK (Handover Completed)</text>

  <!-- Guard B Failure Result -->
  <line x1="710" y1="515" x2="425" y2="515" class="line-red" stroke-width="2.5" marker-end="url(#arrow-red)" />
  <rect x="450" y="500" width="240" height="20" fill="#ffffff" />
  <text x="570" y="514" font-size="12" font-weight="700" fill="#dc2626" text-anchor="middle">7b. 409 Conflict (ALREADY_COLLECTED)</text>

</svg>