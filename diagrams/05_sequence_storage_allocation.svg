<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
    .card-header { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .header-text { font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .line { stroke: #334155; stroke-width: 2; fill: none; }
    .line-blue { stroke: #2563eb; stroke-width: 2; fill: none; }
    .line-green { stroke: #16a34a; stroke-width: 2; fill: none; }
    .line-red { stroke: #dc2626; stroke-width: 2; fill: none; }
    .line-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .badge { rx: 12; stroke-width: 1.2; }
    .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; }
</style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>

  </defs>
  <!-- Pure White Background -->
  <rect width="1200" height="650" fill="#ffffff" />
  
  <!-- Header Title -->
  <text x="50" y="45" class="title">05. Sequence Diagram - Dynamic Storage Allocation</text>
  <text x="50" y="70" class="subtitle">Strategy ranking followed by atomic Compare-And-Swap (CAS) shelf slot reservation</text>
  
  <!-- Diagram Content -->
  
  <!-- Lifelines -->
  <!-- 1. Staff -->
  <g transform="translate(100, 110)">
    <rect width="140" height="36" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" />
    <text x="70" y="22" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">Security Staff</text>
    <line x1="70" y1="36" x2="70" y2="560" class="line-dash" />
  </g>
  <!-- 2. Allocation Service -->
  <g transform="translate(380, 110)">
    <rect width="170" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
    <text x="85" y="22" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">StorageAllocationService</text>
    <line x1="85" y1="36" x2="85" y2="560" class="line-dash" />
  </g>
  <!-- 3. Allocation Strategy -->
  <g transform="translate(680, 110)">
    <rect width="180" height="36" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8" />
    <text x="90" y="22" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">SuitableSizeStrategy</text>
    <line x1="90" y1="36" x2="90" y2="560" class="line-dash" />
  </g>
  <!-- 4. MongoDB -->
  <g transform="translate(980, 110)">
    <rect width="140" height="36" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />
    <text x="70" y="22" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">MongoDB (PyMongo)</text>
    <line x1="70" y1="36" x2="70" y2="560" class="line-dash" />
  </g>

  <!-- Step 1: Assign Storage Request -->
  <line x1="170" y1="180" x2="465" y2="180" class="line" marker-end="url(#arrow)" />
  <rect x="200" y="162" width="220" height="18" fill="#ffffff" />
  <text x="310" y="175" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">1. assign_storage(package_id)</text>

  <!-- Step 2: Fetch Active Shelves -->
  <line x1="465" y1="220" x2="1050" y2="220" class="line" marker-end="url(#arrow)" />
  <rect x="520" y="202" width="240" height="18" fill="#ffffff" />
  <text x="640" y="215" font-size="11" font-weight="500" fill="#0f172a">2. find(is_active=True)</text>

  <!-- Step 3: Shelves Returned -->
  <line x1="1050" y1="260" x2="465" y2="260" class="line-dash" marker-end="url(#arrow-gray)" />
  <rect x="580" y="245" width="220" height="16" fill="#ffffff" />
  <text x="690" y="257" font-size="10.5" fill="#64748b" text-anchor="middle">3. return candidates: [Shelf A, Shelf B, ...]</text>

  <!-- Step 4: Rank candidates via Strategy -->
  <line x1="465" y1="300" x2="770" y2="300" class="line-blue" marker-end="url(#arrow-blue)" />
  <rect x="490" y="282" width="240" height="18" fill="#ffffff" />
  <text x="610" y="295" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">4. rank(candidates, pkg.size)</text>

  <!-- Step 5: Strategy returns sorted shelf IDs -->
  <line x1="770" y1="340" x2="465" y2="340" class="line-dash" marker-end="url(#arrow-gray)" />
  <rect x="520" y="325" width="180" height="16" fill="#ffffff" />
  <text x="610" y="337" font-size="10.5" fill="#64748b" text-anchor="middle">5. sorted: [Shelf B-02 (best), ...]</text>

  <!-- Step 6: Atomic Conditional CAS Reservation -->
  <line x1="465" y1="390" x2="1050" y2="390" class="line-green" marker-end="url(#arrow-green)" />
  <rect x="500" y="372" width="460" height="18" fill="#ffffff" />
  <text x="730" y="385" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">6. find_one_and_update(occupied_count &lt; capacity, {$inc: {occupied_count: 1}})</text>

  <!-- Step 7: Reservation confirmed -->
  <line x1="1050" y1="430" x2="465" y2="430" class="line-dash" marker-end="url(#arrow-gray)" />
  <rect x="650" y="415" width="180" height="16" fill="#ffffff" />
  <text x="740" y="427" font-size="10.5" fill="#64748b" text-anchor="middle">7. matched &amp; reserved: Shelf B-02</text>

  <!-- Step 8: Update Package Status -->
  <line x1="465" y1="470" x2="1050" y2="470" class="line" marker-end="url(#arrow)" />
  <rect x="520" y="452" width="300" height="18" fill="#ffffff" />
  <text x="670" y="465" font-size="11" font-weight="600" fill="#0f172a">8. update(package, status=STORED, shelf_id=B-02)</text>

  <!-- Step 9: Return allocated shelf to staff -->
  <line x1="465" y1="510" x2="170" y2="510" class="line-green" marker-end="url(#arrow-green)" />
  <rect x="210" y="495" width="220" height="18" fill="#ffffff" />
  <text x="320" y="508" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">9. 200 OK (Assigned Shelf "B-02")</text>

</svg>