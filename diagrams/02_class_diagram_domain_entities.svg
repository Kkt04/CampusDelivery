<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 780" width="100%" height="100%">
  <defs>
    <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
    .card-header { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .header-text { font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .line { stroke: #334155; stroke-width: 2; fill: none; }
    .line-blue { stroke: #2563eb; stroke-width: 2; fill: none; }
    .line-green { stroke: #16a34a; stroke-width: 2; fill: none; }
    .line-red { stroke: #dc2626; stroke-width: 2; fill: none; }
    .line-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .badge { rx: 12; stroke-width: 1.2; }
    .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; }
</style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>

  </defs>
  <!-- Pure White Background -->
  <rect width="1300" height="780" fill="#ffffff" />
  
  <!-- Header Title -->
  <text x="50" y="45" class="title">02. Domain Entities &amp; UML Class Diagram</text>
  <text x="50" y="70" class="subtitle">Core domain models, attributes, value objects, and database relationships with multiplicities</text>
  
  <!-- Diagram Content -->
  
  <!-- Base Class: Document (Top Center) -->
  <g transform="translate(490, 90)">
    <rect width="320" height="110" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2" />
    <rect width="320" height="32" rx="8" fill="#f5f3ff" />
    <text x="160" y="16" font-size="10" font-weight="600" fill="#7c3aed" text-anchor="middle">&lt;&lt;abstract base class&gt;&gt;</text>
    <text x="160" y="28" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">Document</text>
    <line x1="0" y1="32" x2="320" y2="32" stroke="#e9d5ff" stroke-width="1.5" />
    <text x="16" y="52" class="mono" font-size="11" fill="#1e293b">+ id: Optional[int]</text>
    <text x="16" y="68" class="mono" font-size="11" fill="#1e293b">+ created_at: datetime</text>
    <text x="16" y="84" class="mono" font-size="11" fill="#1e293b">+ updated_at: datetime</text>
    <line x1="0" y1="92" x2="320" y2="92" stroke="#e9d5ff" stroke-width="1" />
    <text x="16" y="104" class="mono" font-size="10.5" fill="#6d28d9">+ to_doc() dict | from_doc(d) Document</text>
  </g>

  <!-- User Entity (Left) -->
  <g transform="translate(60, 270)">
    <rect width="280" height="210" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <rect width="280" height="32" rx="8" fill="#eff6ff" />
    <text x="140" y="22" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">User</text>
    <line x1="0" y1="32" x2="280" y2="32" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="16" y="55" class="mono" font-size="11" fill="#1e293b">+ id: int (PK)</text>
    <text x="16" y="73" class="mono" font-size="11" fill="#1e293b">+ email: str (UK)</text>
    <text x="16" y="91" class="mono" font-size="11" fill="#1e293b">+ full_name: str</text>
    <text x="16" y="109" class="mono" font-size="11" fill="#1e293b">+ role: UserRole</text>
    <text x="16" y="127" class="mono" font-size="11" fill="#1e293b">+ phone: Optional[str]</text>
    <text x="16" y="145" class="mono" font-size="11" fill="#1e293b">+ is_active: bool</text>
    <line x1="0" y1="155" x2="280" y2="155" stroke="#e2e8f0" stroke-width="1" />
    <text x="16" y="175" class="mono" font-size="11" fill="#2563eb">+ is_learner() bool</text>
    <text x="16" y="195" class="mono" font-size="11" fill="#2563eb">+ can_perform(perm) bool</text>
  </g>

  <!-- Package Entity (Center) -->
  <g transform="translate(500, 260)">
    <rect width="300" height="250" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <rect width="300" height="32" rx="8" fill="#ecfdf5" />
    <text x="150" y="22" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">Package</text>
    <line x1="0" y1="32" x2="300" y2="32" stroke="#a7f3d0" stroke-width="1.5" />
    <text x="16" y="54" class="mono" font-size="11" fill="#1e293b">+ id: int (PK)</text>
    <text x="16" y="72" class="mono" font-size="11" fill="#1e293b">+ tracking_id: str (UK)</text>
    <text x="16" y="90" class="mono" font-size="11" fill="#1e293b">+ internal_code: str (UK)</text>
    <text x="16" y="108" class="mono" font-size="11" fill="#1e293b">+ recipient_user_id: int (FK)</text>
    <text x="16" y="126" class="mono" font-size="11" fill="#1e293b">+ courier: CourierService</text>
    <text x="16" y="144" class="mono" font-size="11" fill="#1e293b">+ size: PackageSize</text>
    <text x="16" y="162" class="mono" font-size="11" fill="#1e293b">+ status: PackageStatus</text>
    <text x="16" y="180" class="mono" font-size="11" fill="#1e293b">+ storage_location_id: int? (FK)</text>
    <text x="16" y="198" class="mono" font-size="11" fill="#1e293b">+ arrival_date: datetime</text>
    <line x1="0" y1="208" x2="300" y2="208" stroke="#e2e8f0" stroke-width="1" />
    <text x="16" y="226" class="mono" font-size="11" fill="#059669">+ is_overdue() bool</text>
    <text x="16" y="242" class="mono" font-size="11" fill="#059669">+ can_transition_to(target) bool</text>
  </g>

  <!-- StorageShelf Entity (Right) -->
  <g transform="translate(950, 270)">
    <rect width="280" height="210" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2" />
    <rect width="280" height="32" rx="8" fill="#fffbeb" />
    <text x="140" y="22" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">StorageLocation</text>
    <line x1="0" y1="32" x2="280" y2="32" stroke="#fde68a" stroke-width="1.5" />
    <text x="16" y="55" class="mono" font-size="11" fill="#1e293b">+ id: int (PK)</text>
    <text x="16" y="73" class="mono" font-size="11" fill="#1e293b">+ code: str (UK, e.g. "B-02")</text>
    <text x="16" y="91" class="mono" font-size="11" fill="#1e293b">+ zone: str</text>
    <text x="16" y="109" class="mono" font-size="11" fill="#1e293b">+ size_class: PackageSize</text>
    <text x="16" y="127" class="mono" font-size="11" fill="#1e293b">+ capacity: int</text>
    <text x="16" y="145" class="mono" font-size="11" fill="#1e293b">+ occupied_count: int</text>
    <line x1="0" y1="155" x2="280" y2="155" stroke="#e2e8f0" stroke-width="1" />
    <text x="16" y="175" class="mono" font-size="11" fill="#d97706">+ accepts(pkg_size) bool</text>
    <text x="16" y="195" class="mono" font-size="11" fill="#d97706">+ available_slots() int</text>
  </g>

  <!-- PickupToken Entity (Bottom Left) -->
  <g transform="translate(200, 560)">
    <rect width="280" height="170" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <rect width="280" height="32" rx="8" fill="#fef2f2" />
    <text x="140" y="22" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">PickupToken</text>
    <line x1="0" y1="32" x2="280" y2="32" stroke="#fecaca" stroke-width="1.5" />
    <text x="16" y="55" class="mono" font-size="11" fill="#1e293b">+ id: int (PK)</text>
    <text x="16" y="73" class="mono" font-size="11" fill="#1e293b">+ package_id: int (FK)</text>
    <text x="16" y="91" class="mono" font-size="11" fill="#1e293b">+ token_hash: str (HMAC)</text>
    <text x="16" y="109" class="mono" font-size="11" fill="#1e293b">+ expires_at: datetime (30m)</text>
    <text x="16" y="127" class="mono" font-size="11" fill="#1e293b">+ used_at: Optional[datetime]</text>
    <line x1="0" y1="135" x2="280" y2="135" stroke="#e2e8f0" stroke-width="1" />
    <text x="16" y="153" class="mono" font-size="11" fill="#dc2626">+ is_valid() bool | verify(code) bool</text>
  </g>

  <!-- PickupRecord Entity (Bottom Right) -->
  <g transform="translate(680, 560)">
    <rect width="280" height="170" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <rect width="280" height="32" rx="8" fill="#f0f9ff" />
    <text x="140" y="22" font-size="14" font-weight="700" fill="#0369a1" text-anchor="middle">PickupRecord (Receipt)</text>
    <line x1="0" y1="32" x2="280" y2="32" stroke="#bae6fd" stroke-width="1.5" />
    <text x="16" y="55" class="mono" font-size="11" fill="#1e293b">+ id: int (PK)</text>
    <text x="16" y="73" class="mono" font-size="11" fill="#1e293b">+ package_id: int (UK, FK)</text>
    <text x="16" y="91" class="mono" font-size="11" fill="#1e293b">+ token_id: int (UK, FK)</text>
    <text x="16" y="109" class="mono" font-size="11" fill="#1e293b">+ verified_by_user_id: int</text>
    <text x="16" y="127" class="mono" font-size="11" fill="#1e293b">+ collected_at: datetime</text>
    <line x1="0" y1="135" x2="280" y2="135" stroke="#e2e8f0" stroke-width="1" />
    <text x="16" y="153" class="mono" font-size="11" fill="#0284c7">+ immutable handover receipt</text>
  </g>

  <!-- Inheritance lines from BaseDocument -->
  <path d="M 650 200 L 650 260" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <path d="M 490 145 L 200 145 L 200 270" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <path d="M 810 145 L 1090 145 L 1090 270" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow)" />

  <!-- Relationships with Multiplicities -->
  <!-- User 1 to 0..* Package -->
  <line x1="340" y1="360" x2="500" y2="360" stroke="#334155" stroke-width="2" />
  <rect x="350" y="342" width="20" height="16" fill="#ffffff" /><text x="355" y="354" font-size="12" font-weight="700" fill="#334155">1</text>
  <rect x="465" y="342" width="30" height="16" fill="#ffffff" /><text x="470" y="354" font-size="12" font-weight="700" fill="#334155">0..*</text>

  <!-- Package 0..1 to 0..1 StorageShelf -->
  <line x1="800" y1="360" x2="950" y2="360" stroke="#334155" stroke-width="2" />
  <rect x="810" y="342" width="30" height="16" fill="#ffffff" /><text x="815" y="354" font-size="12" font-weight="700" fill="#334155">0..1</text>
  <rect x="915" y="342" width="30" height="16" fill="#ffffff" /><text x="920" y="354" font-size="12" font-weight="700" fill="#334155">0..1</text>

  <!-- Package 1 to 0..* PickupToken -->
  <path d="M 550 510 L 550 630 L 480 630" stroke="#334155" stroke-width="2" />
  <rect x="555" y="520" width="20" height="16" fill="#ffffff" /><text x="560" y="532" font-size="12" font-weight="700" fill="#334155">1</text>
  <rect x="490" y="612" width="30" height="16" fill="#ffffff" /><text x="495" y="624" font-size="12" font-weight="700" fill="#334155">0..*</text>

  <!-- Package 1 to 1 PickupRecord -->
  <path d="M 750 510 L 750 630 L 680 630" stroke="#334155" stroke-width="2" />
  <rect x="755" y="520" width="20" height="16" fill="#ffffff" /><text x="760" y="532" font-size="12" font-weight="700" fill="#334155">1</text>
  <rect x="655" y="612" width="20" height="16" fill="#ffffff" /><text x="660" y="624" font-size="12" font-weight="700" fill="#334155">1</text>


</svg>