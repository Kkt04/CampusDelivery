<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="100%" height="100%">
  <defs>
    <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
    .card-header { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .header-text { font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .line { stroke: #334155; stroke-width: 2; fill: none; }
    .line-blue { stroke: #2563eb; stroke-width: 2; fill: none; }
    .line-green { stroke: #16a34a; stroke-width: 2; fill: none; }
    .line-red { stroke: #dc2626; stroke-width: 2; fill: none; }
    .line-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .badge { rx: 12; stroke-width: 1.2; }
    .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; }
</style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>

  </defs>
  <!-- Pure White Background -->
  <rect width="1280" height="620" fill="#ffffff" />
  
  <!-- Header Title -->
  <text x="50" y="45" class="title">13. Design Patterns Map</text>
  <text x="50" y="70" class="subtitle">Comprehensive implementation of 7 GoF and enterprise patterns across domain, application, and infrastructure layers</text>
  
  <!-- Diagram Content -->
  
  <!-- 7 Patterns Grid -->
  <!-- Pattern 1: Strategy -->
  <g transform="translate(60, 100)">
    <rect width="360" height="150" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <rect width="360" height="30" rx="8" fill="#eff6ff" />
    <text x="180" y="20" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">1. STRATEGY PATTERN (Behavioral)</text>
    <text x="16" y="52" font-size="11" font-weight="600" fill="#0f172a">Protocol: StorageAllocationStrategy</text>
    <text x="16" y="70" class="mono" font-size="10.5" fill="#2563eb">- SuitableSizeStrategy (best-fit bounding)</text>
    <text x="16" y="88" class="mono" font-size="10.5" fill="#2563eb">- FirstAvailableStrategy (code alphabetical)</text>
    <text x="16" y="112" font-size="11" fill="#475569">Benefit: Pure ranking algorithm decoupled from</text>
    <text x="16" y="128" font-size="11" fill="#475569">database reservation logic.</text>
  </g>

  <!-- Pattern 2: Observer -->
  <g transform="translate(460, 100)">
    <rect width="360" height="150" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <rect width="360" height="30" rx="8" fill="#ecfdf5" />
    <text x="180" y="20" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">2. OBSERVER PATTERN (Behavioral)</text>
    <text x="16" y="52" font-size="11" font-weight="600" fill="#0f172a">Subject: EventBus | Event: PackageStatusChanged</text>
    <text x="16" y="70" class="mono" font-size="10.5" fill="#059669">- NotificationDispatcher (InApp, Email)</text>
    <text x="16" y="88" class="mono" font-size="10.5" fill="#059669">- AuditLogger (compliance record)</text>
    <text x="16" y="112" font-size="11" fill="#475569">Benefit: Subscribers run safely post-commit; a</text>
    <text x="16" y="128" font-size="11" fill="#475569">failing email never rolls back package delivery.</text>
  </g>

  <!-- Pattern 3: State -->
  <g transform="translate(860, 100)">
    <rect width="360" height="150" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2" />
    <rect width="360" height="30" rx="8" fill="#f5f3ff" />
    <text x="180" y="20" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">3. STATE PATTERN (Behavioral)</text>
    <text x="16" y="52" font-size="11" font-weight="600" fill="#0f172a">Engine: PackageStateMachine &amp; Transition table</text>
    <text x="16" y="70" class="mono" font-size="10.5" fill="#7c3aed">- 12 lifecycle states, explicit Transition objects</text>
    <text x="16" y="88" class="mono" font-size="10.5" fill="#7c3aed">- Precondition guards (roles, storage, token)</text>
    <text x="16" y="112" font-size="11" fill="#475569">Benefit: Impossible to skip states or collect an</text>
    <text x="16" y="128" font-size="11" fill="#475569">unregistered or non-shelved package.</text>
  </g>

  <!-- Pattern 4: Factory Method -->
  <g transform="translate(60, 280)">
    <rect width="360" height="150" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2" />
    <rect width="360" height="30" rx="8" fill="#fffbeb" />
    <text x="180" y="20" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">4. FACTORY METHOD (Creational)</text>
    <text x="16" y="52" font-size="11" font-weight="600" fill="#0f172a">Factory: NotificationChannelFactory</text>
    <text x="16" y="70" class="mono" font-size="10.5" fill="#d97706">- build_channel("in_app") -&gt; InAppChannel</text>
    <text x="16" y="88" class="mono" font-size="10.5" fill="#d97706">- build_channel("email") -&gt; ConsoleEmailChannel</text>
    <text x="16" y="112" font-size="11" fill="#475569">Benefit: Adding SMS or WebPush requires zero</text>
    <text x="16" y="128" font-size="11" fill="#475569">modifications to existing intake/handover code.</text>
  </g>

  <!-- Pattern 5: Unit of Work -->
  <g transform="translate(460, 280)">
    <rect width="360" height="150" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <rect width="360" height="30" rx="8" fill="#fef2f2" />
    <text x="180" y="20" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">5. UNIT OF WORK &amp; REPO (Architectural)</text>
    <text x="16" y="52" font-size="11" font-weight="600" fill="#0f172a">Coordinator: MongoUnitOfWork</text>
    <text x="16" y="70" class="mono" font-size="10.5" fill="#dc2626">- Coordinates repositories across collections</text>
    <text x="16" y="88" class="mono" font-size="10.5" fill="#dc2626">- Buffers domain events until commit succeeds</text>
    <text x="16" y="112" font-size="11" fill="#475569">Benefit: Atomic business transactions without</text>
    <text x="16" y="128" font-size="11" fill="#475569">leaking PyMongo sessions into business logic.</text>
  </g>

  <!-- Pattern 6: Singleton -->
  <g transform="translate(860, 280)">
    <rect width="360" height="150" rx="8" fill="#ffffff" stroke="#0891b2" stroke-width="2" />
    <rect width="360" height="30" rx="8" fill="#ecfeff" />
    <text x="180" y="20" font-size="13" font-weight="700" fill="#0e7490" text-anchor="middle">6. SINGLETON (Creational)</text>
    <text x="16" y="52" font-size="11" font-weight="600" fill="#0f172a">Composition Root: container.py &amp; get_settings()</text>
    <text x="16" y="70" class="mono" font-size="10.5" fill="#0891b2">- Cached singleton Settings with pydantic</text>
    <text x="16" y="88" class="mono" font-size="10.5" fill="#0891b2">- Global thread-safe EventBus singleton</text>
    <text x="16" y="112" font-size="11" fill="#475569">Benefit: Predictable configuration loading and</text>
    <text x="16" y="128" font-size="11" fill="#475569">preventing duplicate connection pools.</text>
  </g>

  <!-- Pattern 7: Decorator (Bottom Full Width) -->
  <g transform="translate(60, 460)">
    <rect width="1160" height="100" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2" />
    <rect width="1160" height="30" rx="8" fill="#f8fafc" />
    <text x="580" y="20" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">7. DECORATOR &amp; INTERCEPTOR PATTERNS (Structural)</text>
    <text x="20" y="52" font-size="11" font-weight="600" fill="#0f172a">FastAPI Middlewares &amp; Exception Handlers</text>
    <text x="20" y="72" class="mono" font-size="11" fill="#334155">- request_id_middleware: Decorates each request with a unique UUID for distributed tracing</text>
    <text x="20" y="90" class="mono" font-size="11" fill="#334155">- app_error_handler: Intercepts custom AppError exceptions and transforms them into standard RFC 7807 responses</text>
  </g>

</svg>