<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
    .card-header { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .header-text { font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .line { stroke: #334155; stroke-width: 2; fill: none; }
    .line-blue { stroke: #2563eb; stroke-width: 2; fill: none; }
    .line-green { stroke: #16a34a; stroke-width: 2; fill: none; }
    .line-red { stroke: #dc2626; stroke-width: 2; fill: none; }
    .line-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .badge { rx: 12; stroke-width: 1.2; }
    .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; }
</style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>

  </defs>
  <!-- Pure White Background -->
  <rect width="1200" height="650" fill="#ffffff" />
  
  <!-- Header Title -->
  <text x="50" y="45" class="title">11. Component Architecture Diagram</text>
  <text x="50" y="70" class="subtitle">Layered modular monolith showing physical separation between frontend, API gateway, domain core, and database</text>
  
  <!-- Diagram Content -->
  
  <!-- Tier 1: Client Presentation -->
  <g transform="translate(100, 100)">
    <rect width="1000" height="90" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <rect width="1000" height="28" rx="8" fill="#eff6ff" />
    <text x="20" y="19" font-size="12" font-weight="700" fill="#1d4ed8">TIER 1: Single Page Application (React 18 + TypeScript + Tailwind CSS)</text>
    
    <g transform="translate(40, 38)">
      <rect width="280" height="40" rx="6" fill="#ffffff" stroke="#93c5fd" />
      <text x="140" y="25" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">Learner Portal (Mobile First)</text>
    </g>
    <g transform="translate(360, 38)">
      <rect width="280" height="40" rx="6" fill="#ffffff" stroke="#93c5fd" />
      <text x="140" y="25" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">Security Staff Console (Gate 2)</text>
    </g>
    <g transform="translate(680, 38)">
      <rect width="280" height="40" rx="6" fill="#ffffff" stroke="#93c5fd" />
      <text x="140" y="25" font-size="12" font-weight="600" fill="#1e40af" text-anchor="middle">Operations Admin Dashboard</text>
    </g>
  </g>
  <line x1="600" y1="190" x2="600" y2="230" class="line" stroke-width="2.5" marker-end="url(#arrow)" />
  <text x="615" y="215" font-size="10" font-weight="600" fill="#64748b">HTTPS / JSON REST</text>

  <!-- Tier 2: API Gateway &amp; Auth -->
  <g transform="translate(100, 230)">
    <rect width="1000" height="90" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <rect width="1000" height="28" rx="8" fill="#ecfdf5" />
    <text x="20" y="19" font-size="12" font-weight="700" fill="#047857">TIER 2: API Gateway &amp; Middleware (FastAPI)</text>
    
    <g transform="translate(40, 38)">
      <rect width="280" height="40" rx="6" fill="#ffffff" stroke="#6ee7b7" />
      <text x="140" y="25" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">JWT Auth &amp; RBAC Guard</text>
    </g>
    <g transform="translate(360, 38)">
      <rect width="280" height="40" rx="6" fill="#ffffff" stroke="#6ee7b7" />
      <text x="140" y="25" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">Token Bucket Rate Limiter</text>
    </g>
    <g transform="translate(680, 38)">
      <rect width="280" height="40" rx="6" fill="#ffffff" stroke="#6ee7b7" />
      <text x="140" y="25" font-size="12" font-weight="600" fill="#065f46" text-anchor="middle">RFC 7807 Error Interceptor</text>
    </g>
  </g>
  <line x1="600" y1="320" x2="600" y2="360" class="line" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Tier 3: Core Domain &amp; Services -->
  <g transform="translate(100, 360)">
    <rect width="1000" height="90" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2" />
    <rect width="1000" height="28" rx="8" fill="#f5f3ff" />
    <text x="20" y="19" font-size="12" font-weight="700" fill="#5b21b6">TIER 3: Application Services &amp; Domain Core</text>
    
    <g transform="translate(40, 38)">
      <rect width="280" height="40" rx="6" fill="#ffffff" stroke="#c4b5fd" />
      <text x="140" y="25" font-size="12" font-weight="600" fill="#5b21b6" text-anchor="middle">Intake &amp; Allocation Services</text>
    </g>
    <g transform="translate(360, 38)">
      <rect width="280" height="40" rx="6" fill="#ffffff" stroke="#c4b5fd" />
      <text x="140" y="25" font-size="12" font-weight="600" fill="#5b21b6" text-anchor="middle">Pickup &amp; Handover Service</text>
    </g>
    <g transform="translate(680, 38)">
      <rect width="280" height="40" rx="6" fill="#ffffff" stroke="#c4b5fd" />
      <text x="140" y="25" font-size="12" font-weight="600" fill="#5b21b6" text-anchor="middle">EventBus &amp; State Machine</text>
    </g>
  </g>
  <line x1="600" y1="450" x2="600" y2="490" class="line" stroke-width="2.5" marker-end="url(#arrow)" />

  <!-- Tier 4: Data Layer -->
  <g transform="translate(100, 490)">
    <rect width="1000" height="90" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="2" />
    <rect width="1000" height="28" rx="8" fill="#fff7ed" />
    <text x="20" y="19" font-size="12" font-weight="700" fill="#c2410c">TIER 4: Persistence &amp; Database Layer (MongoDB 6+)</text>
    
    <g transform="translate(40, 38)">
      <rect width="280" height="40" rx="6" fill="#ffffff" stroke="#fdba74" />
      <text x="140" y="25" font-size="12" font-weight="600" fill="#9a3412" text-anchor="middle">MongoUnitOfWork</text>
    </g>
    <g transform="translate(360, 38)">
      <rect width="280" height="40" rx="6" fill="#ffffff" stroke="#fdba74" />
      <text x="140" y="25" font-size="12" font-weight="600" fill="#9a3412" text-anchor="middle">PyMongo Document Repositories</text>
    </g>
    <g transform="translate(680, 38)">
      <rect width="280" height="40" rx="6" fill="#ffffff" stroke="#fdba74" />
      <text x="140" y="25" font-size="12" font-weight="600" fill="#9a3412" text-anchor="middle">Compound Unique Indexes &amp; Counters</text>
    </g>
  </g>

</svg>