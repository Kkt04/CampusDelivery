<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 800" width="100%" height="100%">
  <defs>
    <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
    .card-header { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .header-text { font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .line { stroke: #334155; stroke-width: 2; fill: none; }
    .line-blue { stroke: #2563eb; stroke-width: 2; fill: none; }
    .line-green { stroke: #16a34a; stroke-width: 2; fill: none; }
    .line-red { stroke: #dc2626; stroke-width: 2; fill: none; }
    .line-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .badge { rx: 12; stroke-width: 1.2; }
    .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; }
</style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>

  </defs>
  <!-- Pure White Background -->
  <rect width="1300" height="800" fill="#ffffff" />
  
  <!-- Header Title -->
  <text x="50" y="45" class="title">01. Use Case Diagram - Campus Delivery System</text>
  <text x="50" y="70" class="subtitle">Functional requirements, actors, core use cases, and system boundary</text>
  
  <!-- Diagram Content -->
  
  <!-- System Boundary Box -->
  <rect x="360" y="100" width="680" height="660" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,6" />
  <rect x="380" y="115" width="310" height="28" rx="6" fill="#f1f5f9" />
  <text x="390" y="134" font-size="12" font-weight="700" fill="#334155">SYSTEM BOUNDARY: Campus Delivery Platform</text>

  <!-- ACTOR 1: Learner (Left Top) -->
  <g transform="translate(100, 190)">
    <circle cx="60" cy="40" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
    <line x1="60" y1="62" x2="60" y2="105" stroke="#2563eb" stroke-width="3" />
    <line x1="30" y1="80" x2="90" y2="80" stroke="#2563eb" stroke-width="3" />
    <line x1="60" y1="105" x2="35" y2="140" stroke="#2563eb" stroke-width="3" />
    <line x1="60" y1="105" x2="85" y2="140" stroke="#2563eb" stroke-width="3" />
    <rect x="10" y="155" width="100" height="26" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="60" y="172" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">Learner</text>
  </g>

  <!-- ACTOR 2: Security Staff (Left Bottom) -->
  <g transform="translate(100, 480)">
    <circle cx="60" cy="40" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" />
    <line x1="60" y1="62" x2="60" y2="105" stroke="#d97706" stroke-width="3" />
    <line x1="30" y1="80" x2="90" y2="80" stroke="#d97706" stroke-width="3" />
    <line x1="60" y1="105" x2="35" y2="140" stroke="#d97706" stroke-width="3" />
    <line x1="60" y1="105" x2="85" y2="140" stroke="#d97706" stroke-width="3" />
    <rect x="0" y="155" width="120" height="26" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <text x="60" y="172" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">Security Staff</text>
  </g>

  <!-- ACTOR 3: Operations Admin (Right Center) -->
  <g transform="translate(1120, 330)">
    <circle cx="60" cy="40" r="22" fill="#f3e8ff" stroke="#9333ea" stroke-width="2.5" />
    <line x1="60" y1="62" x2="60" y2="105" stroke="#9333ea" stroke-width="3" />
    <line x1="30" y1="80" x2="90" y2="80" stroke="#9333ea" stroke-width="3" />
    <line x1="60" y1="105" x2="35" y2="140" stroke="#9333ea" stroke-width="3" />
    <line x1="60" y1="105" x2="85" y2="140" stroke="#9333ea" stroke-width="3" />
    <rect x="0" y="155" width="120" height="26" rx="6" fill="#f3e8ff" stroke="#e9d5ff" stroke-width="1" />
    <text x="60" y="172" font-size="13" font-weight="700" fill="#7e22ce" text-anchor="middle">Ops Admin</text>
  </g>

  <!-- Learner Use Cases (Top Section) -->
  <g id="uc-learner">
    <ellipse cx="500" cy="180" rx="95" ry="24" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8" />
    <text x="500" y="184" font-size="12" font-weight="600" fill="#0369a1" text-anchor="middle">Track Own Packages</text>

    <ellipse cx="730" cy="180" rx="100" ry="24" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8" />
    <text x="730" y="184" font-size="12" font-weight="600" fill="#0369a1" text-anchor="middle">View Notifications</text>

    <ellipse cx="500" cy="260" rx="100" ry="24" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="500" y="264" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Generate Pickup Code</text>

    <ellipse cx="730" cy="260" rx="95" ry="24" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.8" />
    <text x="730" y="264" font-size="12" font-weight="600" fill="#0369a1" text-anchor="middle">View Handover History</text>
  </g>

  <!-- Staff Use Cases (Middle Section) -->
  <g id="uc-staff">
    <ellipse cx="500" cy="380" rx="100" ry="24" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
    <text x="500" y="384" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">Scan &amp; Ingest Package</text>

    <ellipse cx="730" cy="380" rx="100" ry="24" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" />
    <text x="730" y="384" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">Triage &amp; Match Student</text>

    <ellipse cx="500" cy="460" rx="100" ry="24" fill="#fffbeb" stroke="#d97706" stroke-width="1.8" />
    <text x="500" y="464" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">Assign Storage Shelf</text>

    <ellipse cx="730" cy="460" rx="100" ry="24" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
    <text x="730" y="464" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">Verify Code &amp; Handover</text>
  </g>

  <!-- Admin Use Cases (Bottom Section) -->
  <g id="uc-admin">
    <ellipse cx="500" cy="580" rx="100" ry="24" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8" />
    <text x="500" y="584" font-size="12" font-weight="600" fill="#7e22ce" text-anchor="middle">Monitor Live Dashboard</text>

    <ellipse cx="730" cy="580" rx="100" ry="24" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8" />
    <text x="730" y="584" font-size="12" font-weight="600" fill="#7e22ce" text-anchor="middle">Manage Storage Shelves</text>

    <ellipse cx="500" cy="660" rx="100" ry="24" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8" />
    <text x="500" y="664" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">Resolve Incident / Dispute</text>

    <ellipse cx="730" cy="660" rx="100" ry="24" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8" />
    <text x="730" y="664" font-size="12" font-weight="600" fill="#7e22ce" text-anchor="middle">Inspect Security Audit Log</text>
  </g>

  <!-- Actor to Use Case Connecting Lines (Clear, direct, no crossing chaos) -->
  <!-- Learner lines -->
  <line x1="190" y1="260" x2="405" y2="185" stroke="#2563eb" stroke-width="1.8" />
  <line x1="190" y1="260" x2="400" y2="260" stroke="#2563eb" stroke-width="2" />
  <line x1="190" y1="260" x2="635" y2="260" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Staff lines -->
  <line x1="190" y1="550" x2="400" y2="385" stroke="#d97706" stroke-width="2" />
  <line x1="190" y1="550" x2="400" y2="460" stroke="#d97706" stroke-width="1.8" />
  <line x1="190" y1="550" x2="630" y2="460" stroke="#059669" stroke-width="2" />

  <!-- Admin lines -->
  <line x1="1120" y1="430" x2="830" y2="580" stroke="#9333ea" stroke-width="1.8" />
  <line x1="1120" y1="430" x2="600" y2="580" stroke="#9333ea" stroke-width="1.8" />
  <line x1="1120" y1="430" x2="600" y2="660" stroke="#dc2626" stroke-width="1.8" />
  <line x1="1120" y1="430" x2="830" y2="660" stroke="#9333ea" stroke-width="1.8" />

  <!-- Include / Extend relationships between use cases -->
  <!-- Intake <<include>> Triage -->
  <path d="M 600 380 L 630 380" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-gray)" />
  <rect x="590" y="362" width="55" height="15" rx="3" fill="#ffffff" />
  <text x="617" y="373" font-size="9" fill="#64748b" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

  <!-- Handover <<include>> Verify Code -->
  <path d="M 600 460 L 630 460" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-gray)" />
  <rect x="590" y="442" width="55" height="15" rx="3" fill="#ffffff" />
  <text x="617" y="453" font-size="9" fill="#64748b" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>

</svg>