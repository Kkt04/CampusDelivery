<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 900" width="100%" height="100%">
  <defs>
    <style>
    .bg { fill: #f8fafc; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #0f172a; font-size: 20px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; fill: #475569; font-size: 13px; }
    .c-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; text-anchor: middle; }
    .c-stereo { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; text-anchor: middle; font-style: italic; }
    .attr { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11px; fill: #1e293b; }
    .method { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11px; fill: #0369a1; font-weight: 500; }
    .sep { stroke: #e2e8f0; stroke-width: 1; }
    .actor-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 4; }
    .part-box { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; rx: 4; }
    .life-line { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; }
    .msg-line { stroke: #0f172a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .ret-line { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-gray); }
    .msg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #0f172a; font-weight: 500; }
    .ret-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; font-style: italic; }
    .note-box { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1; rx: 4; }
    .note-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #92400e; font-weight: 500; }
    .card { font-family: sans-serif; font-size: 11px; fill: #475569; font-weight: 600; }
</style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0f172a" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>

  </defs>
  <rect width="1350" height="900" class="bg" />
  
  <text x="50" y="40" class="title" font-size="22">01. Use Case Diagram - Campus Delivery Management System</text>
  <text x="50" y="65" class="subtitle">Complete functional model showing 3 primary actors, background timer/dispatcher, and 25 use cases</text>

  <!-- Actors Column -->
  <!-- Learner -->
  <circle cx="100" cy="180" r="18" fill="#e0f2fe" stroke="#0369a1" stroke-width="2" />
  <line x1="100" y1="198" x2="100" y2="235" stroke="#0369a1" stroke-width="3" />
  <line x1="75" y1="210" x2="125" y2="210" stroke="#0369a1" stroke-width="3" />
  <line x1="100" y1="235" x2="80" y2="265" stroke="#0369a1" stroke-width="3" />
  <line x1="100" y1="235" x2="120" y2="265" stroke="#0369a1" stroke-width="3" />
  <text x="100" y="285" class="c-name">Learner</text>
  <text x="100" y="300" class="subtitle" font-size="11" text-anchor="middle">Student Recipient</text>

  <!-- Security Staff -->
  <circle cx="100" cy="420" r="18" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
  <line x1="100" y1="438" x2="100" y2="475" stroke="#b45309" stroke-width="3" />
  <line x1="75" y1="450" x2="125" y2="450" stroke="#b45309" stroke-width="3" />
  <line x1="100" y1="475" x2="80" y2="505" stroke="#b45309" stroke-width="3" />
  <line x1="100" y1="475" x2="120" y2="505" stroke="#b45309" stroke-width="3" />
  <text x="100" y="525" class="c-name">Security Staff</text>
  <text x="100" y="540" class="subtitle" font-size="11" text-anchor="middle">Gate No. 2 Officer</text>

  <!-- Operations Admin -->
  <circle cx="100" cy="670" r="18" fill="#ede9fe" stroke="#6d28d9" stroke-width="2" />
  <line x1="100" y1="688" x2="100" y2="725" stroke="#6d28d9" stroke-width="3" />
  <line x1="75" y1="700" x2="125" y2="700" stroke="#6d28d9" stroke-width="3" />
  <line x1="100" y1="725" x2="80" y2="755" stroke="#6d28d9" stroke-width="3" />
  <line x1="100" y1="725" x2="120" y2="755" stroke="#6d28d9" stroke-width="3" />
  <text x="100" y="775" class="c-name">Operations Admin</text>
  <text x="100" y="790" class="subtitle" font-size="11" text-anchor="middle">Logistics Manager</text>

  <!-- System Boundary Box -->
  <rect x="230" y="90" width="1070" height="780" class="box" />
  <text x="250" y="118" class="subtitle" font-size="16" fill="#1e293b">Campus Delivery Management System (Boundary)</text>

  <!-- Subgraph 1: Authentication & Shared -->
  <rect x="260" y="140" width="310" height="150" class="box" fill="#f1f5f9" />
  <text x="275" y="162" class="subtitle">Auth &amp; Profile (All Users)</text>
  <rect x="280" y="180" width="270" height="36" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="415" y="202" class="msg-text" text-anchor="middle">UC-01: Sign In / Out (JWT &amp; Rate Limit)</text>
  <rect x="280" y="230" width="270" height="36" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="415" y="252" class="msg-text" text-anchor="middle">UC-02: View Profile &amp; Role Permissions</text>

  <!-- Subgraph 2: Learner Operations -->
  <rect x="260" y="310" width="310" height="300" class="box" fill="#f1f5f9" />
  <text x="275" y="332" class="subtitle">Learner Operations</text>
  <rect x="280" y="350" width="270" height="36" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="415" y="372" class="msg-text" text-anchor="middle">UC-03: View Own Packages &amp; Shelf</text>
  <rect x="280" y="400" width="270" height="36" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="415" y="422" class="msg-text" text-anchor="middle">UC-04: View &amp; Mark Notifications Read</text>
  <rect x="280" y="450" width="270" height="36" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="415" y="472" class="msg-text" text-anchor="middle">UC-05: Request 6-Digit Pickup Code</text>
  <rect x="280" y="500" width="270" height="36" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="415" y="522" class="msg-text" text-anchor="middle">UC-06: View Collection History</text>
  <rect x="280" y="550" width="270" height="36" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="415" y="572" class="msg-text" text-anchor="middle">UC-07: Report Issue / Incident</text>

  <!-- Subgraph 3: Security Gate No. 2 Intake -->
  <rect x="600" y="140" width="340" height="470" class="box" fill="#f1f5f9" />
  <text x="615" y="162" class="subtitle">Gate No. 2 Intake &amp; Handover</text>
  <rect x="620" y="180" width="300" height="36" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="770" y="202" class="msg-text" text-anchor="middle">UC-08: Register Incoming Package</text>
  <rect x="620" y="230" width="300" height="36" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="770" y="252" class="msg-text" text-anchor="middle">UC-09: Search Active Learner Directory</text>
  <rect x="620" y="280" width="300" height="36" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="770" y="302" class="msg-text" text-anchor="middle">UC-10: Identify Unknown Recipient</text>
  <rect x="620" y="330" width="300" height="36" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="770" y="352" class="msg-text" text-anchor="middle">UC-11: Assign / Move Storage Shelf</text>
  <rect x="620" y="380" width="300" height="36" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="770" y="402" class="msg-text" text-anchor="middle">UC-12: Mark Package Ready for Pickup</text>
  <rect x="620" y="430" width="300" height="36" rx="18" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" />
  <text x="770" y="452" class="msg-text" text-anchor="middle">UC-13: Verify Pickup Code &amp; Learner ID</text>
  <rect x="620" y="480" width="300" height="36" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="770" y="502" class="msg-text" text-anchor="middle">UC-14: Complete Handover (Atomic Slot Release)</text>
  <rect x="620" y="530" width="300" height="36" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="770" y="552" class="msg-text" text-anchor="middle">UC-15: Record Incident (Damage / Hold)</text>
  <rect x="620" y="570" width="300" height="30" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="770" y="589" class="msg-text" text-anchor="middle">UC-16: Hand Back to Courier</text>

  <!-- Subgraph 4: Operations Administration -->
  <rect x="970" y="140" width="310" height="580" class="box" fill="#f1f5f9" />
  <text x="985" y="162" class="subtitle">Operations &amp; Governance</text>
  <rect x="990" y="180" width="270" height="34" rx="17" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="1125" y="201" class="msg-text" text-anchor="middle">UC-17: View Live Dashboard &amp; Stats</text>
  <rect x="990" y="225" width="270" height="34" rx="17" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="1125" y="246" class="msg-text" text-anchor="middle">UC-18: Search, Filter &amp; Export Parcels</text>
  <rect x="990" y="270" width="270" height="34" rx="17" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="1125" y="291" class="msg-text" text-anchor="middle">UC-19: Review Overdue / Damaged Queues</text>
  <rect x="990" y="315" width="270" height="34" rx="17" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="1125" y="336" class="msg-text" text-anchor="middle">UC-20: Manage Storage Locations &amp; Cap</text>
  <rect x="990" y="360" width="270" height="34" rx="17" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="1125" y="381" class="msg-text" text-anchor="middle">UC-21: Manage Users (Deactivate/Reset)</text>
  <rect x="990" y="405" width="270" height="34" rx="17" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="1125" y="426" class="msg-text" text-anchor="middle">UC-22: Resolve Incidents &amp; Holds</text>
  <rect x="990" y="450" width="270" height="34" rx="17" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="1125" y="471" class="msg-text" text-anchor="middle">UC-23: Request Courier Return / Mark Lost</text>
  <rect x="990" y="495" width="270" height="34" rx="17" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="1125" y="516" class="msg-text" text-anchor="middle">UC-24: View Immutable Audit Logs</text>
  <rect x="990" y="540" width="270" height="34" rx="17" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="1125" y="561" class="msg-text" text-anchor="middle">UC-25: Retry Failed Notifications</text>
  <rect x="990" y="585" width="270" height="34" rx="17" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="1125" y="606" class="msg-text" text-anchor="middle">UC-26: Received vs Collected Report</text>

  <!-- Actor Associations -->
  <!-- Learner to UCs -->
  <line x1="120" y1="200" x2="280" y2="198" class="msg-line" />
  <line x1="120" y1="210" x2="280" y2="368" class="msg-line" />
  <line x1="120" y1="220" x2="280" y2="418" class="msg-line" />
  <line x1="120" y1="230" x2="280" y2="468" class="msg-line" />
  <line x1="120" y1="240" x2="280" y2="518" class="msg-line" />
  <line x1="120" y1="250" x2="280" y2="568" class="msg-line" />

  <!-- Security to UCs -->
  <line x1="125" y1="440" x2="280" y2="198" class="msg-line" stroke="#b45309" />
  <line x1="125" y1="450" x2="620" y2="198" class="msg-line" stroke="#b45309" />
  <line x1="125" y1="460" x2="620" y2="298" class="msg-line" stroke="#b45309" />
  <line x1="125" y1="470" x2="620" y2="348" class="msg-line" stroke="#b45309" />
  <line x1="125" y1="480" x2="620" y2="398" class="msg-line" stroke="#b45309" />
  <line x1="125" y1="490" x2="620" y2="498" class="msg-line" stroke="#b45309" />
  <line x1="125" y1="500" x2="620" y2="548" class="msg-line" stroke="#b45309" />

  <!-- Admin to UCs -->
  <line x1="125" y1="690" x2="280" y2="198" class="msg-line" stroke="#6d28d9" />
  <line x1="125" y1="710" x2="990" y2="197" class="msg-line" stroke="#6d28d9" />
  <line x1="125" y1="720" x2="990" y2="287" class="msg-line" stroke="#6d28d9" />
  <line x1="125" y1="730" x2="990" y2="332" class="msg-line" stroke="#6d28d9" />
  <line x1="125" y1="740" x2="990" y2="377" class="msg-line" stroke="#6d28d9" />
  <line x1="125" y1="750" x2="990" y2="422" class="msg-line" stroke="#6d28d9" />
  <line x1="125" y1="760" x2="990" y2="512" class="msg-line" stroke="#6d28d9" />

  <!-- Legend -->
  <rect x="260" y="800" width="1020" height="50" fill="#ffffff" stroke="#cbd5e1" rx="6" />
  <rect x="280" y="815" width="20" height="20" rx="10" fill="#eff6ff" stroke="#3b82f6" />
  <text x="310" y="828" font-size="12" fill="#334155" class="subtitle">Core Use Case</text>
  <rect x="420" y="815" width="20" height="20" rx="10" fill="#f0fdf4" stroke="#22c55e" />
  <text x="450" y="828" font-size="12" fill="#334155" class="subtitle">Included Sub-Use Case</text>
  <line x1="620" y1="825" x2="660" y2="825" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="670" y="828" font-size="12" fill="#334155" class="subtitle">&lt;&lt;include&gt;&gt; mandatory invocation</text>
  <line x1="870" y1="825" x2="910" y2="825" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="920" y="828" font-size="12" fill="#334155" class="subtitle">&lt;&lt;extend&gt;&gt; conditional exception</text>

</svg>
