<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
    .card-header { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .header-text { font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .line { stroke: #334155; stroke-width: 2; fill: none; }
    .line-blue { stroke: #2563eb; stroke-width: 2; fill: none; }
    .line-green { stroke: #16a34a; stroke-width: 2; fill: none; }
    .line-red { stroke: #dc2626; stroke-width: 2; fill: none; }
    .line-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .badge { rx: 12; stroke-width: 1.2; }
    .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; }
</style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>

  </defs>
  <!-- Pure White Background -->
  <rect width="1200" height="750" fill="#ffffff" />
  
  <!-- Header Title -->
  <text x="50" y="45" class="title">09. Activity Diagram - Concurrency Control &amp; Race Resolution</text>
  <text x="50" y="70" class="subtitle">Atomic conditional operations guaranteeing zero shelf overfills and zero double-handover claims</text>
  
  <!-- Diagram Content -->
  
  <!-- Left Swimlane: Storage Reservation -->
  <g transform="translate(60, 100)">
    <rect width="520" height="620" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
    <rect width="520" height="38" rx="10" fill="#eff6ff" />
    <text x="260" y="24" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">LANE 1: Concurrent Storage Reservation</text>

    <!-- Start -->
    <circle cx="260" cy="75" r="12" fill="#0f172a" />
    <line x1="260" y1="87" x2="260" y2="115" class="line" marker-end="url(#arrow)" />

    <!-- Step 1 -->
    <rect x="130" y="115" width="260" height="42" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
    <text x="260" y="141" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Fetch Shelves Matching Package Size</text>
    <line x1="260" y1="157" x2="260" y2="185" class="line" marker-end="url(#arrow)" />

    <!-- Step 2 -->
    <rect x="130" y="185" width="260" height="42" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
    <text x="260" y="211" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Strategy Ranks Candidates by Best-Fit</text>
    <line x1="260" y1="227" x2="260" y2="255" class="line" marker-end="url(#arrow)" />

    <!-- Step 3: CAS Loop -->
    <rect x="110" y="255" width="300" height="52" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="260" y="278" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Atomic CAS Update on Top Candidate:</text>
    <text x="260" y="296" class="mono" font-size="10" fill="#1e40af" text-anchor="middle">occupied_count &lt; capacity, {$inc: 1}</text>
    <line x1="260" y1="307" x2="260" y2="335" class="line" marker-end="url(#arrow)" />

    <!-- Decision: Slot Reserved? -->
    <polygon points="260,335 340,370 260,405 180,370" fill="#ffffff" stroke="#eab308" stroke-width="2" />
    <text x="260" y="374" font-size="11" font-weight="700" fill="#854d0e" text-anchor="middle">Reserved?</text>

    <!-- Branch No: Retry Next Candidate -->
    <path d="M 340 370 L 440 370 L 440 281 L 410 281" class="line-red" marker-end="url(#arrow-red)" />
    <rect x="360" y="355" width="60" height="16" fill="#ffffff" /><text x="390" y="367" font-size="10" font-weight="700" fill="#dc2626">No (Full)</text>

    <!-- Branch Yes: Success -->
    <line x1="260" y1="405" x2="260" y2="445" class="line-green" marker-end="url(#arrow-green)" />
    <rect x="265" y="415" width="35" height="16" fill="#ffffff" /><text x="282" y="427" font-size="10" font-weight="700" fill="#16a34a">Yes</text>

    <rect x="130" y="445" width="260" height="42" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8" />
    <text x="260" y="471" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Bind Package to Shelf &amp; Set READY</text>
    <line x1="260" y1="487" x2="260" y2="520" class="line" marker-end="url(#arrow)" />

    <!-- End Node -->
    <circle cx="260" cy="535" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    <circle cx="260" cy="535" r="8" fill="#0f172a" />
  </g>

  <!-- Right Swimlane: Handover CAS -->
  <g transform="translate(620, 100)">
    <rect width="520" height="620" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <rect width="520" height="38" rx="10" fill="#ecfdf5" />
    <text x="260" y="24" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">LANE 2: Concurrent Handover &amp; Token Barrier</text>

    <!-- Start -->
    <circle cx="260" cy="75" r="12" fill="#0f172a" />
    <line x1="260" y1="87" x2="260" y2="115" class="line" marker-end="url(#arrow)" />

    <!-- Step 1 -->
    <rect x="130" y="115" width="260" height="42" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
    <text x="260" y="141" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Submit 6-Digit Code &amp; Learner ID</text>
    <line x1="260" y1="157" x2="260" y2="185" class="line" marker-end="url(#arrow)" />

    <!-- Step 2 -->
    <rect x="130" y="185" width="260" height="42" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
    <text x="260" y="211" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Token Bucket Rate Limiter Check</text>
    <line x1="260" y1="227" x2="260" y2="255" class="line" marker-end="url(#arrow)" />

    <!-- Step 3: CAS Token update -->
    <rect x="110" y="255" width="300" height="52" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="260" y="278" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Atomic Token Invalidation:</text>
    <text x="260" y="296" class="mono" font-size="10" fill="#166534" text-anchor="middle">find_one_and_update(used_at=null)</text>
    <line x1="260" y1="307" x2="260" y2="335" class="line" marker-end="url(#arrow)" />

    <!-- Decision: Valid &amp; Unused? -->
    <polygon points="260,335 340,370 260,405 180,370" fill="#ffffff" stroke="#eab308" stroke-width="2" />
    <text x="260" y="374" font-size="11" font-weight="700" fill="#854d0e" text-anchor="middle">Unused?</text>

    <!-- Branch No: Already Claimed -->
    <line x1="340" y1="370" x2="430" y2="370" class="line-red" marker-end="url(#arrow-red)" />
    <rect x="350" y="355" width="30" height="16" fill="#ffffff" /><text x="365" y="367" font-size="10" font-weight="700" fill="#dc2626">No</text>
    <rect x="430" y="352" width="70" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" />
    <text x="465" y="374" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">409 Conflict</text>

    <!-- Branch Yes: Proceed to Handover -->
    <line x1="260" y1="405" x2="260" y2="445" class="line-green" marker-end="url(#arrow-green)" />
    <rect x="265" y="415" width="35" height="16" fill="#ffffff" /><text x="282" y="427" font-size="10" font-weight="700" fill="#16a34a">Yes</text>

    <rect x="110" y="445" width="300" height="42" rx="6" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8" />
    <text x="260" y="471" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Insert PickupRecord &amp; Decrement Shelf</text>
    <line x1="260" y1="487" x2="260" y2="520" class="line" marker-end="url(#arrow)" />

    <!-- End Node -->
    <circle cx="260" cy="535" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    <circle cx="260" cy="535" r="8" fill="#0f172a" />
  </g>

</svg>