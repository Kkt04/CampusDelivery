<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <style>
    .bg { fill: #f8fafc; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #0f172a; font-size: 20px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; fill: #475569; font-size: 13px; }
    .c-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; text-anchor: middle; }
    .c-stereo { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; text-anchor: middle; font-style: italic; }
    .attr { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11px; fill: #1e293b; }
    .method { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11px; fill: #0369a1; font-weight: 500; }
    .sep { stroke: #e2e8f0; stroke-width: 1; }
    .actor-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 4; }
    .part-box { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; rx: 4; }
    .life-line { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; }
    .msg-line { stroke: #0f172a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .ret-line { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-gray); }
    .msg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #0f172a; font-weight: 500; }
    .ret-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; font-style: italic; }
    .note-box { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1; rx: 4; }
    .note-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #92400e; font-weight: 500; }
    .step-badge { fill: #2563eb; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
</style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0f172a" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>

  </defs>
  <rect width="1200" height="800" class="bg" />

  <text x="40" y="35" class="title">09. Activity Diagram - Concurrency Control &amp; Atomic Race Resolution</text>
  <text x="40" y="55" class="subtitle">Execution flow of atomic conditional updates preventing storage overflow and double handover</text>

  <!-- Left Swimlane: Storage Reservation -->
  <rect x="50" y="80" width="530" height="680" class="box" fill="#ffffff" stroke="#3b82f6" />
  <text x="70" y="110" class="c-name" font-size="14" fill="#1d4ed8" text-anchor="start">1. Storage Allocation Concurrency Barrier</text>

  <circle cx="315" cy="140" r="12" fill="#0f172a" />
  <text x="315" y="165" class="c-name" font-size="10.5">Allocation Request</text>

  <rect x="185" y="180" width="260" height="40" class="box" />
  <text x="315" y="204" class="msg-text" text-anchor="middle">Fetch candidate shelves &amp; rank</text>
  <line x1="315" y1="152" x2="315" y2="180" class="msg-line" />

  <polygon points="315,240 375,265 315,290 255,265" fill="#fef3c7" stroke="#d97706" />
  <text x="315" y="269" class="msg-text" text-anchor="middle" font-size="9.5">Candidate?</text>
  <line x1="315" y1="220" x2="315" y2="240" class="msg-line" />

  <!-- Out of space -->
  <line x1="255" y1="265" x2="110" y2="265" class="msg-line" stroke="#dc2626" />
  <text x="180" y="255" class="ret-text" fill="#dc2626">No candidates</text>
  <rect x="70" y="290" width="120" height="35" class="box" fill="#fff1f2" stroke="#dc2626" />
  <text x="130" y="312" class="c-name" font-size="10" fill="#dc2626">409 STORAGE_FULL</text>

  <!-- Atomic Attempt -->
  <line x1="315" y1="290" x2="315" y2="330" class="msg-line" />
  <text x="330" y="310" class="ret-text">Yes</text>

  <rect x="115" y="330" width="400" height="60" class="box" stroke="#2563eb" stroke-width="2" />
  <text x="315" y="350" class="c-name" font-size="11" fill="#1d4ed8">Execute Atomic find_one_and_update:</text>
  <text x="315" y="365" class="attr" font-size="9.5" text-anchor="middle">filter: {_id: id, is_active: true, occupied_count: {$lt: capacity}}</text>
  <text x="315" y="380" class="attr" font-size="9.5" text-anchor="middle">update: {$inc: {occupied_count: 1}}</text>

  <!-- Result decision -->
  <polygon points="315,420 375,445 315,470 255,445" fill="#fef3c7" stroke="#d97706" />
  <text x="315" y="449" class="msg-text" text-anchor="middle" font-size="9.5">1 row modified?</text>
  <line x1="315" y1="390" x2="315" y2="420" class="msg-line" />

  <!-- Lost race loop -->
  <path d="M 375,445 L 450,445 L 450,265 L 375,265" class="ret-line" stroke="#d97706" />
  <text x="460" y="360" class="ret-text" fill="#d97706">0 rows (Lost race, shelf became full) -&gt; Try Next</text>

  <!-- Won race -->
  <line x1="315" y1="470" x2="315" y2="520" class="msg-line" stroke="#16a34a" />
  <text x="330" y="495" class="ret-text" fill="#16a34a">1 row (Won race)</text>

  <rect x="185" y="520" width="260" height="40" class="box" fill="#ecfdf5" stroke="#16a34a" />
  <text x="315" y="544" class="c-name" font-size="11" fill="#047857">Slot Reserved &amp; Package Assigned</text>

  <circle cx="315" cy="620" r="14" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
  <circle cx="315" cy="620" r="8" fill="#16a34a" />
  <line x1="315" y1="560" x2="315" y2="606" class="msg-line" stroke="#16a34a" />
  <text x="315" y="650" class="c-name" font-size="10.5" fill="#047857">Terminus</text>

  <!-- Right Swimlane: Handover Concurrency -->
  <rect x="620" y="80" width="530" height="680" class="box" fill="#ffffff" stroke="#7c3aed" />
  <text x="640" y="110" class="c-name" font-size="14" fill="#6d28d9" text-anchor="start">2. Handover Double-Collection Barrier</text>

  <circle cx="885" cy="140" r="12" fill="#0f172a" />
  <text x="885" y="165" class="c-name" font-size="10.5">Handover Submission</text>

  <!-- Idempotency Check -->
  <polygon points="885,185 945,210 885,235 825,210" fill="#fef3c7" stroke="#d97706" />
  <text x="885" y="214" class="msg-text" text-anchor="middle" font-size="9">Idempotent?</text>
  <line x1="885" y1="152" x2="885" y2="185" class="msg-line" />

  <line x1="825" y1="210" x2="700" y2="210" class="msg-line" stroke="#2563eb" />
  <text x="760" y="200" class="ret-text" fill="#2563eb">Key Replayed</text>
  <rect x="650" y="235" width="130" height="35" class="box" fill="#eff6ff" stroke="#2563eb" />
  <text x="715" y="256" class="c-name" font-size="10" fill="#1d4ed8">200 Replay Result</text>

  <!-- Atomic Token Consumption -->
  <line x1="885" y1="235" x2="885" y2="280" class="msg-line" />
  <text x="900" y="255" class="ret-text">New POST</text>

  <rect x="690" y="280" width="390" height="60" class="box" stroke="#7c3aed" stroke-width="2" />
  <text x="885" y="300" class="c-name" font-size="11" fill="#6d28d9">Atomic Token Consumption:</text>
  <text x="885" y="315" class="attr" font-size="9.5" text-anchor="middle">filter: {_id: token.id, used_at: null, revoked_at: null}</text>
  <text x="885" y="330" class="attr" font-size="9.5" text-anchor="middle">update: {$set: {used_at: now}}</text>

  <!-- Decision: Token updated? -->
  <polygon points="885,370 945,395 885,420 825,395" fill="#fef3c7" stroke="#d97706" />
  <text x="885" y="399" class="msg-text" text-anchor="middle" font-size="9.5">Token consumed?</text>
  <line x1="885" y1="340" x2="885" y2="370" class="msg-line" />

  <!-- Race loser -->
  <line x1="825" y1="395" x2="680" y2="395" class="msg-line" stroke="#dc2626" />
  <text x="750" y="385" class="ret-text" fill="#dc2626">0 rows modified</text>
  <rect x="650" y="420" width="140" height="35" class="box" fill="#fff1f2" stroke="#dc2626" />
  <text x="720" y="442" class="c-name" font-size="10" fill="#dc2626">409 ALREADY_COLLECTED</text>

  <!-- Race winner -->
  <line x1="885" y1="420" x2="885" y2="470" class="msg-line" stroke="#16a34a" />
  <text x="900" y="445" class="ret-text" fill="#16a34a">1 row modified</text>

  <rect x="710" y="470" width="350" height="75" class="box" fill="#f0fdf4" stroke="#16a34a" />
  <text x="885" y="490" class="c-name" font-size="10.5" fill="#047857">1. Compare &amp; Set status -&gt; COLLECTED</text>
  <text x="885" y="508" class="c-name" font-size="10.5" fill="#047857">2. Decrement shelf occupancy -1</text>
  <text x="885" y="526" class="c-name" font-size="10.5" fill="#047857">3. Insert PickupRecord (UNIQUE package_id)</text>

  <circle cx="885" cy="620" r="14" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
  <circle cx="885" cy="620" r="8" fill="#16a34a" />
  <line x1="885" y1="545" x2="885" y2="606" class="msg-line" stroke="#16a34a" />
  <text x="885" y="650" class="c-name" font-size="10.5" fill="#047857">Handover Terminus</text>

</svg>
