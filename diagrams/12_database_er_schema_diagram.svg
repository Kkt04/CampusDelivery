<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 680" width="100%" height="100%">
  <defs>
    <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
    .card-header { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .header-text { font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .line { stroke: #334155; stroke-width: 2; fill: none; }
    .line-blue { stroke: #2563eb; stroke-width: 2; fill: none; }
    .line-green { stroke: #16a34a; stroke-width: 2; fill: none; }
    .line-red { stroke: #dc2626; stroke-width: 2; fill: none; }
    .line-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .badge { rx: 12; stroke-width: 1.2; }
    .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; }
</style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>

  </defs>
  <!-- Pure White Background -->
  <rect width="1250" height="680" fill="#ffffff" />
  
  <!-- Header Title -->
  <text x="50" y="45" class="title">12. Database ER / Collection Schema Diagram</text>
  <text x="50" y="70" class="subtitle">MongoDB collections, primary keys, foreign relations, compound indexes, and uniqueness constraints</text>
  
  <!-- Diagram Content -->
  
  <!-- Table 1: users -->
  <g transform="translate(60, 100)">
    <rect width="280" height="190" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
    <rect width="280" height="30" rx="6" fill="#eff6ff" />
    <text x="140" y="20" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">users</text>
    <text x="16" y="52" class="mono" font-size="11" fill="#1e293b">PK  id: int</text>
    <text x="16" y="72" class="mono" font-size="11" fill="#1e293b">UK  email: string</text>
    <text x="16" y="92" class="mono" font-size="11" fill="#1e293b">    full_name: string</text>
    <text x="16" y="112" class="mono" font-size="11" fill="#1e293b">    role: string</text>
    <text x="16" y="132" class="mono" font-size="11" fill="#1e293b">    password_hash: string</text>
    <text x="16" y="152" class="mono" font-size="11" fill="#1e293b">    is_active: bool</text>
    <text x="16" y="172" class="mono" font-size="11" fill="#64748b">    created_at, updated_at</text>
  </g>

  <!-- Table 2: packages -->
  <g transform="translate(460, 100)">
    <rect width="320" height="230" rx="6" fill="#ffffff" stroke="#059669" stroke-width="2" />
    <rect width="320" height="30" rx="6" fill="#ecfdf5" />
    <text x="160" y="20" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">packages</text>
    <text x="16" y="52" class="mono" font-size="11" fill="#1e293b">PK  id: int</text>
    <text x="16" y="72" class="mono" font-size="11" fill="#1e293b">UK  tracking_id: string</text>
    <text x="16" y="92" class="mono" font-size="11" fill="#1e293b">UK  internal_code: string</text>
    <text x="16" y="112" class="mono" font-size="11" fill="#1e293b">FK  recipient_user_id: int?</text>
    <text x="16" y="132" class="mono" font-size="11" fill="#1e293b">FK  storage_location_id: int?</text>
    <text x="16" y="152" class="mono" font-size="11" fill="#1e293b">    status: string</text>
    <text x="16" y="172" class="mono" font-size="11" fill="#1e293b">    size: string</text>
    <text x="16" y="192" class="mono" font-size="11" fill="#1e293b">    courier: string</text>
    <text x="16" y="212" class="mono" font-size="11" fill="#64748b">IX: (recipient_user_id, status)</text>
  </g>

  <!-- Table 3: storage_locations -->
  <g transform="translate(900, 100)">
    <rect width="280" height="190" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="2" />
    <rect width="280" height="30" rx="6" fill="#fffbeb" />
    <text x="140" y="20" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">storage_locations</text>
    <text x="16" y="52" class="mono" font-size="11" fill="#1e293b">PK  id: int</text>
    <text x="16" y="72" class="mono" font-size="11" fill="#1e293b">UK  code: string (e.g. "B-02")</text>
    <text x="16" y="92" class="mono" font-size="11" fill="#1e293b">    zone: string</text>
    <text x="16" y="112" class="mono" font-size="11" fill="#1e293b">    size_class: string</text>
    <text x="16" y="132" class="mono" font-size="11" fill="#1e293b">    capacity: int</text>
    <text x="16" y="152" class="mono" font-size="11" fill="#1e293b">    occupied_count: int (CAS)</text>
    <text x="16" y="172" class="mono" font-size="11" fill="#1e293b">    is_active: bool</text>
  </g>

  <!-- Table 4: pickup_tokens -->
  <g transform="translate(200, 420)">
    <rect width="280" height="170" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <rect width="280" height="30" rx="6" fill="#fef2f2" />
    <text x="140" y="20" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">pickup_tokens</text>
    <text x="16" y="52" class="mono" font-size="11" fill="#1e293b">PK  id: int</text>
    <text x="16" y="72" class="mono" font-size="11" fill="#1e293b">FK  package_id: int</text>
    <text x="16" y="92" class="mono" font-size="11" fill="#1e293b">    token_hash: string (HMAC)</text>
    <text x="16" y="112" class="mono" font-size="11" fill="#1e293b">    expires_at: datetime</text>
    <text x="16" y="132" class="mono" font-size="11" fill="#1e293b">    used_at: datetime?</text>
    <text x="16" y="152" class="mono" font-size="11" fill="#1e293b">    attempt_count: int</text>
  </g>

  <!-- Table 5: pickup_records -->
  <g transform="translate(680, 420)">
    <rect width="280" height="170" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="2" />
    <rect width="280" height="30" rx="6" fill="#f5f3ff" />
    <text x="140" y="20" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">pickup_records</text>
    <text x="16" y="52" class="mono" font-size="11" fill="#1e293b">PK  id: int</text>
    <text x="16" y="72" class="mono" font-size="11" fill="#1e293b">UK  package_id: int (FK)</text>
    <text x="16" y="92" class="mono" font-size="11" fill="#1e293b">UK  token_id: int (FK)</text>
    <text x="16" y="112" class="mono" font-size="11" fill="#1e293b">FK  verified_by_user_id: int</text>
    <text x="16" y="132" class="mono" font-size="11" fill="#1e293b">    collected_at: datetime</text>
    <text x="16" y="152" class="mono" font-size="11" fill="#64748b">Unique constraints enforce 1 record</text>
  </g>

  <!-- Relationship Lines -->
  <!-- users -> packages -->
  <line x1="340" y1="180" x2="460" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />
  <text x="390" y="172" font-size="11" font-weight="600" fill="#334155">1 : N</text>

  <!-- storage_locations -> packages -->
  <line x1="900" y1="180" x2="780" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />
  <text x="830" y="172" font-size="11" font-weight="600" fill="#334155">1 : N</text>

  <!-- packages -> pickup_tokens -->
  <path d="M 520 330 L 520 380 L 340 380 L 340 420" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />
  <text x="430" y="374" font-size="11" font-weight="600" fill="#334155">1 : N</text>

  <!-- packages -> pickup_records -->
  <path d="M 700 330 L 700 380 L 820 380 L 820 420" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />
  <text x="750" y="374" font-size="11" font-weight="600" fill="#334155">1 : 1</text>

</svg>