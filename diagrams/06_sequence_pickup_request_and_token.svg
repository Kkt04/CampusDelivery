<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
    .card-header { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .header-text { font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .line { stroke: #334155; stroke-width: 2; fill: none; }
    .line-blue { stroke: #2563eb; stroke-width: 2; fill: none; }
    .line-green { stroke: #16a34a; stroke-width: 2; fill: none; }
    .line-red { stroke: #dc2626; stroke-width: 2; fill: none; }
    .line-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .badge { rx: 12; stroke-width: 1.2; }
    .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; }
</style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>

  </defs>
  <!-- Pure White Background -->
  <rect width="1200" height="620" fill="#ffffff" />
  
  <!-- Header Title -->
  <text x="50" y="45" class="title">06. Sequence Diagram - Cryptographic Pickup Token Issuance</text>
  <text x="50" y="70" class="subtitle">Salted HMAC-SHA256 generation, revocation of stale tokens, and 30-minute expiry window</text>
  
  <!-- Diagram Content -->
  
  <!-- Lifelines -->
  <!-- 1. Learner -->
  <g transform="translate(120, 110)">
    <rect width="140" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
    <text x="70" y="22" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">Learner</text>
    <line x1="70" y1="36" x2="70" y2="540" class="line-dash" />
  </g>
  <!-- 2. PickupsRouter -->
  <g transform="translate(420, 110)">
    <rect width="140" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
    <text x="70" y="22" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">PickupsRouter</text>
    <line x1="70" y1="36" x2="70" y2="540" class="line-dash" />
  </g>
  <!-- 3. PickupService -->
  <g transform="translate(700, 110)">
    <rect width="150" height="36" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8" />
    <text x="75" y="22" font-size="12" font-weight="700" fill="#7e22ce" text-anchor="middle">PickupService</text>
    <line x1="75" y1="36" x2="75" y2="540" class="line-dash" />
  </g>
  <!-- 4. MongoDB -->
  <g transform="translate(980, 110)">
    <rect width="140" height="36" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />
    <text x="70" y="22" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">MongoDB (PyMongo)</text>
    <line x1="70" y1="36" x2="70" y2="540" class="line-dash" />
  </g>

  <!-- Step 1: Request Pickup Code -->
  <line x1="190" y1="180" x2="490" y2="180" class="line" marker-end="url(#arrow)" />
  <rect x="220" y="162" width="220" height="18" fill="#ffffff" />
  <text x="330" y="175" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">1. POST /packages/42/request-pickup</text>

  <!-- Step 2: Route to Service -->
  <line x1="490" y1="220" x2="775" y2="220" class="line" marker-end="url(#arrow)" />
  <rect x="520" y="202" width="220" height="18" fill="#ffffff" />
  <text x="630" y="215" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">2. generate_pickup_code(42, user)</text>

  <!-- Step 3: Check Package Ownership &amp; Status -->
  <line x1="775" y1="260" x2="1050" y2="260" class="line" marker-end="url(#arrow)" />
  <rect x="800" y="242" width="210" height="18" fill="#ffffff" />
  <text x="905" y="255" font-size="11" font-weight="500" fill="#0f172a">3. find_one(pkg_id=42, recipient=user)</text>

  <!-- Step 4: Status Verified (READY_FOR_PICKUP) -->
  <line x1="1050" y1="295" x2="775" y2="295" class="line-dash" marker-end="url(#arrow-gray)" />
  <rect x="830" y="280" width="160" height="16" fill="#ffffff" />
  <text x="910" y="292" font-size="10.5" fill="#64748b" text-anchor="middle">Status OK (READY_FOR_PICKUP)</text>

  <!-- Step 5: Invalidate previous active token -->
  <line x1="775" y1="335" x2="1050" y2="335" class="line" marker-end="url(#arrow)" />
  <rect x="800" y="318" width="220" height="18" fill="#ffffff" />
  <text x="910" y="330" font-size="11" font-weight="500" fill="#0f172a">4. update_many(pkg_id, used_at=now)</text>

  <!-- Step 6: Generate Cryptographic 6-digit Code &amp; Hash -->
  <path d="M 775 365 C 830 365, 830 390, 775 390" class="line-blue" marker-end="url(#arrow-blue)" />
  <rect x="785" y="370" width="220" height="16" fill="#ffffff" />
  <text x="895" y="382" font-size="11" font-weight="600" fill="#2563eb">5. HMAC-SHA256(secret, salt + code)</text>

  <!-- Step 7: Store Token with 30m TTL -->
  <line x1="775" y1="420" x2="1050" y2="420" class="line" marker-end="url(#arrow)" />
  <rect x="800" y="402" width="220" height="18" fill="#ffffff" />
  <text x="910" y="415" font-size="11" font-weight="600" fill="#0f172a">6. insert_one(token_hash, expires_at=+30m)</text>

  <!-- Step 8: Return Token to Learner -->
  <line x1="775" y1="470" x2="490" y2="470" class="line-dash" marker-end="url(#arrow-gray)" />
  <line x1="490" y1="480" x2="190" y2="480" class="line-green" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <rect x="230" y="468" width="220" height="20" fill="#ffffff" />
  <text x="340" y="482" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">7. 200 OK: Plaintext Code "849201"</text>

</svg>