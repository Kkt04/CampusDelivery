<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
    .card-header { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .header-text { font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .line { stroke: #334155; stroke-width: 2; fill: none; }
    .line-blue { stroke: #2563eb; stroke-width: 2; fill: none; }
    .line-green { stroke: #16a34a; stroke-width: 2; fill: none; }
    .line-red { stroke: #dc2626; stroke-width: 2; fill: none; }
    .line-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .badge { rx: 12; stroke-width: 1.2; }
    .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; }
</style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>

  </defs>
  <!-- Pure White Background -->
  <rect width="1200" height="700" fill="#ffffff" />
  
  <!-- Header Title -->
  <text x="50" y="45" class="title">10. State Machine Transition Diagram</text>
  <text x="50" y="70" class="subtitle">Finite State Machine depicting package lifecycle statuses, guarded transitions, and terminal boundaries</text>
  
  <!-- Diagram Content -->
  
  <!-- Initial State Marker -->
  <circle cx="120" cy="220" r="14" fill="#0f172a" />
  <line x1="134" y1="220" x2="190" y2="220" class="line" marker-end="url(#arrow)" />

  <!-- 1. REGISTERED -->
  <g transform="translate(190, 195)">
    <rect width="140" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="70" y="30" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">REGISTERED</text>
  </g>

  <!-- 2. SORTED -->
  <g transform="translate(430, 195)">
    <rect width="140" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="70" y="30" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">SORTED</text>
  </g>
  <line x1="330" y1="220" x2="430" y2="220" class="line" marker-end="url(#arrow)" />
  <text x="380" y="210" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">triage</text>

  <!-- 3. STORED -->
  <g transform="translate(670, 195)">
    <rect width="140" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <text x="70" y="30" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">STORED</text>
  </g>
  <line x1="570" y1="220" x2="670" y2="220" class="line" marker-end="url(#arrow)" />
  <text x="620" y="210" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">assign</text>

  <!-- 4. READY_FOR_PICKUP -->
  <g transform="translate(910, 195)">
    <rect width="160" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2" />
    <text x="80" y="30" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">READY_FOR_PICKUP</text>
  </g>
  <line x1="810" y1="220" x2="910" y2="220" class="line" marker-end="url(#arrow)" />
  <text x="860" y="210" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">shelved</text>

  <!-- 5. PICKUP_REQUESTED (Lower) -->
  <g transform="translate(910, 360)">
    <rect width="160" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <text x="80" y="30" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">PICKUP_REQUESTED</text>
  </g>
  <line x1="990" y1="245" x2="990" y2="360" class="line-blue" stroke-width="2" marker-end="url(#arrow-blue)" />
  <text x="1055" y="305" font-size="10" font-weight="600" fill="#2563eb">token generated</text>

  <!-- 6. COLLECTED (Terminal Success) -->
  <g transform="translate(910, 520)">
    <rect width="160" height="55" rx="8" fill="#16a34a" stroke="#15803d" stroke-width="2.5" />
    <text x="80" y="33" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">COLLECTED</text>
  </g>
  <line x1="990" y1="410" x2="990" y2="520" class="line-green" stroke-width="2.5" marker-end="url(#arrow-green)" />
  <text x="1045" y="470" font-size="10" font-weight="700" fill="#16a34a">code verified</text>

  <!-- Terminal Circle for COLLECTED -->
  <circle cx="990" cy="625" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
  <circle cx="990" cy="625" r="8" fill="#0f172a" />
  <line x1="990" y1="575" x2="990" y2="611" class="line" marker-end="url(#arrow)" />

  <!-- Exception Branch: UNIDENTIFIED -->
  <g transform="translate(300, 360)">
    <rect width="150" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
    <text x="75" y="30" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">UNIDENTIFIED</text>
  </g>
  <path d="M 260 245 L 260 385 L 300 385" class="line-red" marker-end="url(#arrow-red)" />
  <text x="210" y="320" font-size="10" font-weight="600" fill="#dc2626">no student match</text>

  <!-- Resolve Unidentified back to SORTED -->
  <path d="M 450 385 L 500 385 L 500 245" class="line-green" marker-end="url(#arrow-green)" />
  <text x="510" y="330" font-size="10" font-weight="600" fill="#16a34a">manual match</text>

  <!-- Exception Branch: OVERDUE -->
  <g transform="translate(630, 360)">
    <rect width="140" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
    <text x="70" y="30" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">OVERDUE</text>
  </g>
  <path d="M 910 230 L 700 230 L 700 360" class="line" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <text x="750" y="290" font-size="10" font-weight="600" fill="#d97706">&gt; 48h hold</text>

  <!-- Terminal Return -->
  <g transform="translate(630, 520)">
    <rect width="140" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2" />
    <text x="70" y="30" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">RETURNED</text>
  </g>
  <line x1="700" y1="410" x2="700" y2="520" class="line" marker-end="url(#arrow)" />
  <text x="740" y="470" font-size="10" font-weight="600" fill="#64748b">return to courier</text>

</svg>