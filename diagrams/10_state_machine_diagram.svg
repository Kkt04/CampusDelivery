<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" width="100%" height="100%">
  <defs>
    <style>
    .bg { fill: #f8fafc; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #0f172a; font-size: 20px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 500; fill: #475569; font-size: 13px; }
    .c-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; text-anchor: middle; }
    .c-stereo { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; fill: #64748b; text-anchor: middle; font-style: italic; }
    .attr { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11px; fill: #1e293b; }
    .method { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace; font-size: 11px; fill: #0369a1; font-weight: 500; }
    .sep { stroke: #e2e8f0; stroke-width: 1; }
    .actor-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 4; }
    .part-box { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; rx: 4; }
    .life-line { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4,4; }
    .msg-line { stroke: #0f172a; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .ret-line { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrow-gray); }
    .msg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #0f172a; font-weight: 500; }
    .ret-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #475569; font-style: italic; }
    .note-box { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1; rx: 4; }
    .note-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; fill: #92400e; font-weight: 500; }
    .card { font-family: sans-serif; font-size: 11px; fill: #475569; font-weight: 600; }
</style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0f172a" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>

  </defs>
  <rect width="1300" height="900" class="bg" />
  
  <text x="40" y="35" class="title">10. State Machine Diagram - 12-State Package Lifecycle &amp; Transition Invariants</text>
  <text x="40" y="55" class="subtitle">Explicit table-driven state pattern: states, triggers, role permissions, precondition guards, and terminal invariants</text>

  <!-- Initial State -->
  <circle cx="80" cy="160" r="14" fill="#0f172a" />
  <line x1="94" y1="160" x2="160" y2="160" class="msg-line" />
  <text x="127" y="150" class="ret-text" text-anchor="middle">Intake</text>

  <!-- State: RECEIVED -->
  <rect x="160" y="135" width="130" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
  <text x="225" y="165" class="c-name" fill="#1e40af">RECEIVED</text>

  <!-- Auto Triage Branches -->
  <line x1="290" y1="160" x2="420" y2="160" class="msg-line" stroke="#16a34a" />
  <text x="355" y="150" class="ret-text" fill="#16a34a" text-anchor="middle">Recipient Matched</text>

  <path d="M 225,185 L 225,280 L 420,280" class="msg-line" stroke="#d97706" />
  <text x="320" y="272" class="ret-text" fill="#d97706" text-anchor="middle">No Recipient (Auto Incident)</text>

  <path d="M 225,135 L 225,80 L 420,80" class="msg-line" stroke="#dc2626" />
  <text x="320" y="72" class="ret-text" fill="#dc2626" text-anchor="middle">Damaged (Auto Incident)</text>

  <!-- State: DAMAGED -->
  <rect x="420" y="55" width="140" height="50" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2" />
  <text x="490" y="85" class="c-name" fill="#b91c1c">DAMAGED</text>

  <!-- State: UNIDENTIFIED -->
  <rect x="420" y="255" width="140" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text x="490" y="285" class="c-name" fill="#b45309">UNIDENTIFIED</text>

  <!-- State: VERIFIED -->
  <rect x="420" y="135" width="140" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text x="490" y="165" class="c-name" fill="#1d4ed8">VERIFIED</text>

  <!-- Resolve holds to Verified -->
  <path d="M 490,105 L 490,135" class="msg-line" stroke="#16a34a" />
  <text x="525" y="122" class="ret-text" fill="#16a34a">Release Hold</text>
  <path d="M 490,255 L 490,185" class="msg-line" stroke="#16a34a" />
  <text x="535" y="222" class="ret-text" fill="#16a34a">Identify Learner</text>

  <!-- To STORED -->
  <line x1="560" y1="160" x2="680" y2="160" class="msg-line" stroke="#2563eb" />
  <text x="620" y="150" class="ret-text" fill="#2563eb" text-anchor="middle">Assign Shelf</text>

  <rect x="680" y="135" width="130" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
  <text x="745" y="165" class="c-name" fill="#15803d">STORED</text>

  <!-- To READY_FOR_PICKUP -->
  <line x1="810" y1="160" x2="930" y2="160" class="msg-line" stroke="#16a34a" />
  <text x="870" y="150" class="ret-text" fill="#16a34a" text-anchor="middle">Mark Ready</text>

  <rect x="930" y="135" width="180" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
  <text x="1020" y="165" class="c-name" fill="#047857">READY_FOR_PICKUP</text>

  <!-- To PICKUP_REQUESTED -->
  <path d="M 1020,185 L 1020,280 L 930,280" class="msg-line" stroke="#7c3aed" />
  <text x="1000" y="240" class="ret-text" fill="#7c3aed">Learner: Request Code</text>

  <rect x="750" y="255" width="180" height="50" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" />
  <text x="840" y="285" class="c-name" fill="#6d28d9">PICKUP_REQUESTED</text>

  <!-- Self loop: Re-request code -->
  <path d="M 810,305 C 810,345 870,345 870,305" class="msg-line" stroke="#7c3aed" />
  <text x="840" y="340" class="ret-text" fill="#7c3aed" text-anchor="middle">Re-request Code</text>

  <!-- Handover to COLLECTED -->
  <line x1="750" y1="280" x2="620" y2="280" class="msg-line" stroke="#16a34a" stroke-width="2" />
  <text x="685" y="270" class="ret-text" fill="#16a34a" text-anchor="middle">Verify &amp; Handover</text>

  <!-- State: COLLECTED (Terminal) -->
  <rect x="470" y="400" width="150" height="55" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3" />
  <text x="545" y="425" class="c-name" fill="#14532d" font-size="14">COLLECTED</text>
  <text x="545" y="443" class="subtitle" font-size="10" fill="#15803d">Terminal State</text>
  <path d="M 545,280 L 545,400" class="msg-line" stroke="#16a34a" />

  <circle cx="545" cy="485" r="14" fill="#ffffff" stroke="#16a34a" stroke-width="2" />
  <circle cx="545" cy="485" r="8" fill="#16a34a" />
  <line x1="545" y1="455" x2="545" y2="471" class="msg-line" stroke="#16a34a" />

  <!-- Exceptions: UNDER_INVESTIGATION -->
  <rect x="750" y="450" width="200" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2" />
  <text x="850" y="480" class="c-name" fill="#b45309">UNDER_INVESTIGATION</text>

  <path d="M 745,185 L 745,450" class="ret-line" stroke="#d97706" />
  <path d="M 840,305 L 840,450" class="ret-line" stroke="#d97706" />
  <text x="800" y="380" class="ret-text" fill="#d97706">Incident Escalated</text>

  <!-- State: LOST (Terminal) -->
  <rect x="780" y="600" width="140" height="55" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3" />
  <text x="850" y="625" class="c-name" fill="#991b1b" font-size="14">LOST</text>
  <text x="850" y="643" class="subtitle" font-size="10" fill="#dc2626">Terminal State</text>

  <circle cx="850" cy="685" r="14" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
  <circle cx="850" cy="685" r="8" fill="#dc2626" />
  <line x1="850" y1="655" x2="850" y2="671" class="msg-line" stroke="#dc2626" />

  <!-- Return Flow -->
  <rect x="1000" y="450" width="170" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
  <text x="1085" y="480" class="c-name" fill="#b91c1c">RETURN_REQUESTED</text>
  <path d="M 1020,185 L 1085,185 L 1085,450" class="ret-line" stroke="#ef4444" />
  <text x="1090" y="320" class="ret-text" fill="#ef4444">Overdue &gt; 5d</text>

  <rect x="1000" y="600" width="170" height="55" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3" />
  <text x="1085" y="625" class="c-name" fill="#991b1b" font-size="14">RETURNED</text>
  <text x="1085" y="643" class="subtitle" font-size="10" fill="#dc2626">Terminal State</text>
  <line x1="1085" y1="500" x2="1085" y2="600" class="msg-line" stroke="#dc2626" />

  <circle cx="1085" cy="685" r="14" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
  <circle cx="1085" cy="685" r="8" fill="#dc2626" />
  <line x1="1085" y1="655" x2="1085" y2="671" class="msg-line" stroke="#dc2626" />

  <!-- Invariant Callout -->
  <rect x="50" y="750" width="1180" height="100" class="box" fill="#ffffff" stroke="#3b82f6" />
  <text x="70" y="775" class="c-name" text-anchor="start" fill="#1e40af">Key Low-Level Design &amp; State Machine Invariants (For Viva Examination):</text>
  <text x="70" y="798" class="attr" font-size="11">1. Terminal Invariance: COLLECTED, RETURNED, and LOST have ZERO outgoing edges. Once entered, packages cannot re-open.</text>
  <text x="70" y="816" class="attr" font-size="11">2. Precondition Guards: Transition.guard prevents illegal changes (e.g. READY_FOR_PICKUP strictly requires both recipient AND shelf).</text>
  <text x="70" y="834" class="attr" font-size="11">3. Concurrency Protection: Status updates use optimistic conditional queries (compare_and_set_status requiring expected prior status).</text>

</svg>
