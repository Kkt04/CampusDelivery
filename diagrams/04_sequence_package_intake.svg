<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
    .card-header { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .header-text { font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .line { stroke: #334155; stroke-width: 2; fill: none; }
    .line-blue { stroke: #2563eb; stroke-width: 2; fill: none; }
    .line-green { stroke: #16a34a; stroke-width: 2; fill: none; }
    .line-red { stroke: #dc2626; stroke-width: 2; fill: none; }
    .line-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .badge { rx: 12; stroke-width: 1.2; }
    .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; }
</style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>

  </defs>
  <!-- Pure White Background -->
  <rect width="1200" height="680" fill="#ffffff" />
  
  <!-- Header Title -->
  <text x="50" y="45" class="title">04. Sequence Diagram - Package Intake &amp; Triage</text>
  <text x="50" y="70" class="subtitle">End-to-end flow from Gate No. 2 barcode scan to learner identification and event publishing</text>
  
  <!-- Diagram Content -->
  
  <!-- Lifelines -->
  <!-- 1. Security Staff -->
  <g transform="translate(120, 110)">
    <rect width="140" height="36" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" />
    <text x="70" y="22" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">Security Staff</text>
    <line x1="70" y1="36" x2="70" y2="580" class="line-dash" />
  </g>
  <!-- 2. PackagesRouter -->
  <g transform="translate(400, 110)">
    <rect width="140" height="36" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
    <text x="70" y="22" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">PackagesRouter</text>
    <line x1="70" y1="36" x2="70" y2="580" class="line-dash" />
  </g>
  <!-- 3. IntakeService -->
  <g transform="translate(680, 110)">
    <rect width="150" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8" />
    <text x="75" y="22" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">PackageIntakeService</text>
    <line x1="75" y1="36" x2="75" y2="580" class="line-dash" />
  </g>
  <!-- 4. MongoDB -->
  <g transform="translate(980, 110)">
    <rect width="140" height="36" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />
    <text x="70" y="22" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">MongoDB (PyMongo)</text>
    <line x1="70" y1="36" x2="70" y2="580" class="line-dash" />
  </g>

  <!-- Step 1: POST /packages -->
  <line x1="190" y1="180" x2="470" y2="180" class="line" marker-end="url(#arrow)" />
  <rect x="200" y="162" width="260" height="18" fill="#ffffff" />
  <text x="330" y="175" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">1. POST /packages (courier, recipient, rack_no)</text>

  <!-- Step 2: Validate &amp; Dispatch -->
  <line x1="470" y1="220" x2="755" y2="220" class="line" marker-end="url(#arrow)" />
  <rect x="500" y="202" width="220" height="18" fill="#ffffff" />
  <text x="610" y="215" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">2. register(dto, staff_user)</text>

  <!-- Step 3: Check duplicate tracking -->
  <line x1="755" y1="260" x2="1050" y2="260" class="line" marker-end="url(#arrow)" />
  <rect x="800" y="242" width="200" height="18" fill="#ffffff" />
  <text x="900" y="255" font-size="11" font-weight="500" fill="#0f172a" text-anchor="middle">3. find_one(tracking_id)</text>

  <!-- Step 4: Return null (no duplicate) -->
  <line x1="1050" y1="300" x2="755" y2="300" class="line-dash" marker-end="url(#arrow-gray)" />
  <rect x="830" y="285" width="140" height="16" fill="#ffffff" />
  <text x="900" y="297" font-size="10.5" fill="#64748b" text-anchor="middle">null (unique confirmed)</text>

  <!-- Step 5: Triage Recipient & Allocate Rack -->
  <path d="M 755 330 C 810 330, 810 355, 755 355" class="line" marker-end="url(#arrow)" />
  <rect x="765" y="335" width="260" height="16" fill="#ffffff" />
  <text x="895" y="347" font-size="11" font-weight="600" fill="#059669">4. Match learner &amp; assign Rack (e.g. RACK-A-12)</text>

  <!-- Step 6: Atomic Insert Package -->
  <line x1="755" y1="390" x2="1050" y2="390" class="line" marker-end="url(#arrow)" />
  <rect x="770" y="372" width="260" height="18" fill="#ffffff" />
  <text x="900" y="385" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">5. insert_one(status=READY_FOR_PICKUP, rack)</text>

  <!-- Step 7: DB Success -->
  <line x1="1050" y1="430" x2="755" y2="430" class="line-dash" marker-end="url(#arrow-gray)" />
  <rect x="830" y="415" width="140" height="16" fill="#ffffff" />
  <text x="900" y="427" font-size="10.5" fill="#64748b" text-anchor="middle">{id: 1042, status: "READY"}</text>

  <!-- Step 8: Publish Event -->
  <path d="M 755 460 C 810 460, 810 485, 755 485" class="line-blue" marker-end="url(#arrow-blue)" />
  <rect x="765" y="465" width="250" height="16" fill="#ffffff" />
  <text x="890" y="477" font-size="11" font-weight="600" fill="#2563eb">6. EventBus.publish(ReadyForPickupAlert)</text>

  <!-- Step 9: Return HTTP 201 Created -->
  <line x1="755" y1="520" x2="470" y2="520" class="line-dash" marker-end="url(#arrow-gray)" />
  <line x1="470" y1="530" x2="190" y2="530" class="line-green" marker-end="url(#arrow-green)" />
  <rect x="210" y="518" width="240" height="18" fill="#ffffff" />
  <text x="330" y="531" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">7. 201 Created (code: "PKG-042", rack: "A-12")</text>

</svg>