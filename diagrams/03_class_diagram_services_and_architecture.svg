<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 780" width="100%" height="100%">
  <defs>
    <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 13px; font-weight: 400; fill: #64748b; }
    .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
    .card-header { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .header-text { font-size: 14px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
    .line { stroke: #334155; stroke-width: 2; fill: none; }
    .line-blue { stroke: #2563eb; stroke-width: 2; fill: none; }
    .line-green { stroke: #16a34a; stroke-width: 2; fill: none; }
    .line-red { stroke: #dc2626; stroke-width: 2; fill: none; }
    .line-dash { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
    .badge { rx: 12; stroke-width: 1.2; }
    .badge-text { font-size: 11px; font-weight: 600; text-anchor: middle; }
</style>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>

  </defs>
  <!-- Pure White Background -->
  <rect width="1300" height="780" fill="#ffffff" />
  
  <!-- Header Title -->
  <text x="50" y="45" class="title">03. Services &amp; Architecture Class Diagram</text>
  <text x="50" y="70" class="subtitle">Layered modular monolith: presentation routers, application services, domain protocols, and infrastructure</text>
  
  <!-- Diagram Content -->
  
  <!-- Layer 1: API Routers (Top) -->
  <g transform="translate(60, 100)">
    <rect width="1180" height="100" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <rect width="1180" height="26" rx="8" fill="#f8fafc" />
    <text x="20" y="18" font-size="11" font-weight="700" fill="#475569">API PRESENTATION LAYER (FastAPI Routers)</text>
    
    <g transform="translate(40, 38)">
      <rect width="320" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
      <text x="160" y="24" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">PackagesRouter</text>
      <text x="160" y="40" class="mono" font-size="10.5" fill="#2563eb" text-anchor="middle">POST /intake | POST /{id}/assign</text>
    </g>
    <g transform="translate(430, 38)">
      <rect width="320" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
      <text x="160" y="24" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">PickupsRouter</text>
      <text x="160" y="40" class="mono" font-size="10.5" fill="#2563eb" text-anchor="middle">POST /request-pickup | POST /handover</text>
    </g>
    <g transform="translate(820, 38)">
      <rect width="320" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
      <text x="160" y="24" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">Incidents &amp; Reports Router</text>
      <text x="160" y="40" class="mono" font-size="10.5" fill="#2563eb" text-anchor="middle">POST /incidents | GET /reports/dashboard</text>
    </g>
  </g>

  <!-- Downward Arrows to Services -->
  <line x1="260" y1="200" x2="260" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="650" y1="200" x2="650" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1040" y1="200" x2="1040" y2="260" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Layer 2: Application Use Case Services -->
  <g transform="translate(60, 260)">
    <rect width="1180" height="150" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <rect width="1180" height="26" rx="8" fill="#f8fafc" />
    <text x="20" y="18" font-size="11" font-weight="700" fill="#475569">APPLICATION SERVICE LAYER (Orchestration &amp; Boundaries)</text>

    <g transform="translate(40, 38)">
      <rect width="320" height="95" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
      <text x="160" y="24" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">PackageIntakeService</text>
      <line x1="10" y1="34" x2="310" y2="34" stroke="#bbf7d0" stroke-width="1" />
      <text x="16" y="54" class="mono" font-size="11" fill="#166534">+ register(dto) Package</text>
      <text x="16" y="74" class="mono" font-size="11" fill="#166534">+ triage_recipient(id) User</text>
    </g>
    <g transform="translate(430, 38)">
      <rect width="320" height="95" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
      <text x="160" y="24" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">StorageAllocationService</text>
      <line x1="10" y1="34" x2="310" y2="34" stroke="#bbf7d0" stroke-width="1" />
      <text x="16" y="54" class="mono" font-size="11" fill="#166534">+ allocate_storage(pkg_id) Shelf</text>
      <text x="16" y="74" class="mono" font-size="11" fill="#166534">- _strategy: StorageAllocationStrategy</text>
    </g>
    <g transform="translate(820, 38)">
      <rect width="320" height="95" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
      <text x="160" y="24" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">PickupService</text>
      <line x1="10" y1="34" x2="310" y2="34" stroke="#bbf7d0" stroke-width="1" />
      <text x="16" y="54" class="mono" font-size="11" fill="#166534">+ generate_pickup_code(pkg_id)</text>
      <text x="16" y="74" class="mono" font-size="11" fill="#166534">+ verify_and_handover(code, staff)</text>
    </g>
  </g>

  <!-- Downward Arrows to Domain Protocols -->
  <line x1="650" y1="410" x2="650" y2="470" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Layer 3: Domain &amp; Protocols (DIP) -->
  <g transform="translate(60, 470)">
    <rect width="1180" height="130" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <rect width="1180" height="26" rx="8" fill="#f8fafc" />
    <text x="20" y="18" font-size="11" font-weight="700" fill="#475569">DOMAIN PROTOCOLS &amp; PURE LOGIC (Decoupled Abstractions)</text>

    <g transform="translate(40, 38)">
      <rect width="320" height="75" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" />
      <text x="160" y="20" font-size="10" font-weight="600" fill="#9333ea" text-anchor="middle">&lt;&lt;protocol&gt;&gt;</text>
      <text x="160" y="36" font-size="13" font-weight="700" fill="#7e22ce" text-anchor="middle">IUnitOfWork</text>
      <text x="16" y="58" class="mono" font-size="11" fill="#6b21a8">+ commit() | rollback()</text>
    </g>
    <g transform="translate(430, 38)">
      <rect width="320" height="75" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" />
      <text x="160" y="20" font-size="10" font-weight="600" fill="#9333ea" text-anchor="middle">&lt;&lt;protocol / strategy&gt;&gt;</text>
      <text x="160" y="36" font-size="13" font-weight="700" fill="#7e22ce" text-anchor="middle">StorageAllocationStrategy</text>
      <text x="16" y="58" class="mono" font-size="11" fill="#6b21a8">+ rank(candidates, size) list[id]</text>
    </g>
    <g transform="translate(820, 38)">
      <rect width="320" height="75" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5" />
      <text x="160" y="20" font-size="10" font-weight="600" fill="#9333ea" text-anchor="middle">&lt;&lt;pure domain&gt;&gt;</text>
      <text x="160" y="36" font-size="13" font-weight="700" fill="#7e22ce" text-anchor="middle">PackageStateMachine</text>
      <text x="16" y="58" class="mono" font-size="11" fill="#6b21a8">+ check(curr, target, role, pkg)</text>
    </g>
  </g>

  <!-- Downward Arrows to Infra -->
  <line x1="650" y1="600" x2="650" y2="650" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Layer 4: Infrastructure &amp; Database -->
  <g transform="translate(60, 650)">
    <rect width="1180" height="90" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
    <rect width="1180" height="26" rx="8" fill="#f8fafc" />
    <text x="20" y="18" font-size="11" font-weight="700" fill="#475569">INFRASTRUCTURE LAYER (Persistence &amp; External Adapters)</text>

    <g transform="translate(140, 35)">
      <rect width="400" height="45" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" />
      <text x="200" y="28" font-size="13" font-weight="700" fill="#c2410c" text-anchor="middle">MongoUnitOfWork &amp; PyMongo Repositories</text>
    </g>
    <g transform="translate(640, 35)">
      <rect width="400" height="45" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5" />
      <text x="200" y="28" font-size="13" font-weight="700" fill="#0e7490" text-anchor="middle">EventBus &amp; Notification Dispatcher</text>
    </g>
  </g>

</svg>