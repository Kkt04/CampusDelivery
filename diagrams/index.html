<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Delivery Management System - LLD Diagrams Catalog</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 320px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }
    .header h1 { font-size: 16px; font-weight: 700; color: var(--text); }
    .header p { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px;
    }
    .nav-group-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      padding: 10px 10px 4px;
    }
    .nav-item {
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s ease;
      margin-bottom: 2px;
    }
    .nav-item:hover { background: var(--bg); color: var(--primary); }
    .nav-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }
    .toolbar {
      background: var(--surface);
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toolbar h2 { font-size: 16px; font-weight: 600; }
    .toolbar .actions { display: flex; gap: 8px; }
    .btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: var(--bg); }
    .btn.active { background: var(--primary); color: #ffffff; border-color: var(--primary); }
    #viewer-container {
      flex: 1;
      overflow: auto;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .canvas-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 20px;
      max-width: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .svg-wrapper {
      width: 100%;
      max-width: 1200px;
      overflow: auto;
    }
    .svg-wrapper svg { width: 100%; height: auto; display: block; }
    .source-wrapper {
      width: 100%;
      display: none;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      overflow: auto;
      white-space: pre-wrap;
    }
    .notes-box {
      margin-top: 16px;
      width: 100%;
      padding: 14px 18px;
      background: #eff6ff;
      border-left: 4px solid var(--primary);
      border-radius: 4px;
      font-size: 13px;
      color: #1e40af;
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div class="header">
      <h1>Campus Delivery System</h1>
      <p>Low-Level Design (LLD) Evaluation Catalog</p>
    </div>
    <div class="nav-list" id="nav-list"></div>
  </div>

  <div id="main">
    <div class="toolbar">
      <h2 id="diagram-title">01. Use Case Diagram</h2>
      <div class="actions">
        <button class="btn active" id="btn-svg" onclick="switchView('svg')">Vector SVG</button>
        <button class="btn" id="btn-mmd" onclick="switchView('mmd')">Mermaid Source</button>
        <button class="btn" onclick="openRawSVG()">Open Fullscreen SVG</button>
        <button class="btn" onclick="copyMermaid()">Copy Mermaid</button>
      </div>
    </div>
    <div id="viewer-container">
      <div class="canvas-card">
        <div class="svg-wrapper" id="svg-view"></div>
        <pre class="source-wrapper" id="mmd-view"></pre>
        <div class="notes-box" id="notes-view"></div>
      </div>
    </div>
  </div>

  <script>
    const DIAGRAMS = [
      { id: "01_use_case_diagram", group: "UML Behavioral", title: "01. Use Case Diagram", notes: "Evaluates Point 1 & 6: 3 actors, system boundary, 25 use cases with <<include>> and <<extend>> relationships." },
      { id: "02_class_diagram_domain_entities", group: "UML Structural", title: "02. Class Diagram - Domain Entities", notes: "Evaluates Point 2 & 3: Complete entity model with Document base class, attributes, types, methods, and exact multiplicities." },
      { id: "03_class_diagram_services_and_architecture", group: "UML Structural", title: "03. Class Diagram - Services & Architecture", notes: "Evaluates Point 2, 4, 7: Routers, Use Case Services, Protocols, MongoUnitOfWork, and Container wiring." },
      { id: "04_sequence_package_intake", group: "UML Behavioral", title: "04. Sequence - Package Intake", notes: "Evaluates Point 6 & 9: Gate No. 2 parcel arrival, duplicate checking, triage, and audit trail generation." },
      { id: "05_sequence_storage_allocation", group: "UML Behavioral", title: "05. Sequence - Storage Allocation", notes: "Evaluates Point 5 & 6: Strategy ranking (SuitableSize/FirstAvailable) and atomic conditional single-document reservation." },
      { id: "06_sequence_pickup_request_and_token", group: "UML Behavioral", title: "06. Sequence - Pickup Code Generation", notes: "Evaluates Point 6 & 9: HMAC-SHA256 token issuance, cryptographic salt, 30-min window, and previous token revocation." },
      { id: "07_sequence_pickup_handover_concurrency", group: "UML Behavioral", title: "07. Sequence - Handover & Concurrency Barrier", notes: "Evaluates Point 6, 9, 10: 4-layer defense against double collection: Idempotency, constant-time compare, atomic CAS, UK constraint." },
      { id: "08_activity_package_lifecycle", group: "UML Behavioral", title: "08. Activity - Package Lifecycle", notes: "Evaluates Point 6: End-to-end parcel workflow from intake to collection, investigation, return to courier, or lost hold." },
      { id: "09_activity_concurrency_storage_handover", group: "UML Behavioral", title: "09. Activity - Concurrency Control", notes: "Evaluates Point 6 & 9: Race resolution mechanics for concurrent storage reservations and simultaneous pickup handovers." },
      { id: "10_state_machine_diagram", group: "UML Behavioral", title: "10. State Machine Diagram", notes: "Evaluates Point 5: Table-driven state pattern mapping 12 statuses, guards, role permissions, and terminal invariants." },
      { id: "11_component_architecture_diagram", group: "System Architecture", title: "11. Component Architecture", notes: "Evaluates Point 7 & 10: Modular monolith layered boundaries: Presentation (React), API, Services, Domain, Repos, MongoDB." },
      { id: "12_database_er_schema_diagram", group: "Database Design", title: "12. Database ER / Collection Schema", notes: "Evaluates Point 8: 10 MongoDB collections, keys, relational mapping, unique indexes, and compound indexing strategy." },
      { id: "13_design_patterns_diagram", group: "Design Patterns", title: "13. Design Patterns Map", notes: "Evaluates Point 5: Creational, Structural & Behavioral patterns (Strategy, Observer, State, Factory, UoW, Singleton, Decorator)." }
    ];

    let currentDiagramIndex = 0;
    let currentView = 'svg';

    function initNav() {
      const navList = document.getElementById('nav-list');
      let currentGroup = '';

      DIAGRAMS.forEach((d, idx) => {
        if (d.group !== currentGroup) {
          currentGroup = d.group;
          const groupTitle = document.createElement('div');
          groupTitle.className = 'nav-group-title';
          groupTitle.textContent = currentGroup;
          navList.appendChild(groupTitle);
        }
        const btn = document.createElement('button');
        btn.className = `nav-item ${idx === 0 ? 'active' : ''}`;
        btn.textContent = d.title;
        btn.onclick = () => selectDiagram(idx);
        navList.appendChild(btn);
      });
      loadDiagram(0);
    }

    async function loadDiagram(idx) {
      currentDiagramIndex = idx;
      const d = DIAGRAMS[idx];
      document.getElementById('diagram-title').textContent = d.title;
      document.getElementById('notes-view').innerHTML = `<strong>LLD Evaluation Criteria:</strong> ${d.notes}`;

      document.querySelectorAll('.nav-item').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });

      try {
        const svgRes = await fetch(`${d.id}.svg`);
        const svgText = await svgRes.text();
        document.getElementById('svg-view').innerHTML = svgText;
      } catch (e) {
        document.getElementById('svg-view').innerHTML = `<p>Error loading SVG: ${e.message}</p>`;
      }

      try {
        const mmdRes = await fetch(`${d.id}.mmd`);
        const mmdText = await mmdRes.text();
        document.getElementById('mmd-view').textContent = mmdText;
      } catch (e) {
        document.getElementById('mmd-view').textContent = `// Error loading Mermaid source: ${e.message}`;
      }
    }

    function selectDiagram(idx) {
      loadDiagram(idx);
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('btn-svg').classList.toggle('active', view === 'svg');
      document.getElementById('btn-mmd').classList.toggle('active', view === 'mmd');
      document.getElementById('svg-view').style.display = view === 'svg' ? 'block' : 'none';
      document.getElementById('mmd-view').style.display = view === 'mmd' ? 'block' : 'none';
    }

    function openRawSVG() {
      const d = DIAGRAMS[currentDiagramIndex];
      window.open(`${d.id}.svg`, '_blank');
    }

    function copyMermaid() {
      const mmdText = document.getElementById('mmd-view').textContent;
      navigator.clipboard.writeText(mmdText).then(() => {
        alert("Mermaid source code copied to clipboard!");
      });
    }

    initNav();
  </script>
</body>
</html>
